name: CI

# Controlli senza hardware su tutto quello che questa repo contiene.
#
# ⚠️ I TRE PARSER DEL DS200 devono restare equivalenti byte-per-byte:
#      web/ds200/ds200.js   (JavaScript, la web app)
#      cli/ds_slot_serial.py (Python, il CLI)
#      esp32/src/ds200.h    (C++, il firmware)
# Se cambi il protocollo, aggiornali tutti e tre insieme ai rispettivi test.
# Ora vivono nella stessa repo, quindi questo workflow li verifica in un colpo solo:
# prima erano divisi fra due repo e nessuno controllava che non divergessero.

on:
  push:
    branches: [master, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  # Il sito sta in un sottopercorso di github.io: un link assoluto o una card che
  # punta a una cartella inesistente si vedrebbero solo in produzione. Qui no.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Link interni
        run: node tools/check-links.js

  parsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parser JS DS200 (web/ds200/ds200.js)
        run: node web/ds200/ds200.test.js

      - name: Parser Python DS200 (cli/ds_slot_serial.py)
        run: |
          python -m pip install --upgrade pip pytest
          cd cli && python -m pytest tests/ -q

      - name: Parser C++ DS200 (esp32/src/ds200.h)
        run: |
          g++ -std=c++17 -I esp32/test_host -I esp32/src \
              esp32/test_host/test_ds200.cpp -o /tmp/test_ds200
          /tmp/test_ds200

      - name: Parser JS Ninco (web/ninco/ninco.js)
        run: node web/ninco/ninco.test.js

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('esp32/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Build firmware ESP32
        run: |
          python -m pip install --upgrade pip platformio
          cd esp32 && pio run
