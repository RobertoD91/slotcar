name: CI

# Controlli senza hardware su tutto quello che questa repo contiene.
#
# ⚠️ I TRE PARSER DEL DS200 devono restare equivalenti byte-per-byte:
#      web/ds200-ds300/ds200.js   (JavaScript, la web app)
#      cli/ds_slot_serial.py (Python, il CLI)
#      esp32/src/ds200.h    (C++, il firmware)
# Se cambi il protocollo, aggiornali tutti e tre insieme ai rispettivi test.
# Ora vivono nella stessa repo, quindi questo workflow li verifica in un colpo solo:
# prima erano divisi fra due repo e nessuno controllava che non divergessero.

on:
  push:
    branches: [master, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  # Il sito sta in un sottopercorso di github.io: un link assoluto o una card che
  # punta a una cartella inesistente si vedrebbero solo in produzione. Qui no.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Link interni
        run: node tools/check-links.js

      # Alzare la versione in un posto solo lascia il banner "Nuova versione
      # disponibile" appeso per sempre: l'utente clicca, ricarica, lo rivede.
      # Non rompe niente e non si vede nel diff, quindi lo controlla la CI.
      - name: Versioni allineate
        run: node tools/check-versions.js

      # I colori stanno in web/ui.css e in nessun altro posto. Un `#e0a800`
      # scritto a mano non rompe niente e in una pagina sola è invisibile: si
      # nota solo mettendo due pagine vicine, e nessuno lo fa. È così che erano
      # nati due rossi e quattro gialli diversi.
      - name: Una sola tavolozza
        run: node tools/check-style.js

  parsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parser JS DS200 (web/ds200-ds300/ds200.js)
        run: node web/ds200-ds300/ds200.test.js

      - name: Parser Python DS200 (cli/ds_slot_serial.py)
        run: |
          python -m pip install --upgrade pip pytest
          cd cli && python -m pytest tests/ -q

      - name: Parser C++ DS200 (esp32/src/ds200.h)
        run: |
          g++ -std=c++17 -I esp32/test_host -I esp32/src \
              esp32/test_host/test_ds200.cpp -o /tmp/test_ds200
          /tmp/test_ds200

      - name: Parser JS Ninco (web/ninco/ninco.js)
        run: node web/ninco/ninco.test.js

      - name: Motore di gara e simulatore (web/cronometro/)
        run: node web/cronometro/race.test.js

  # Quello che si vede solo APRENDO la pagina: chiavi i18n non tradotte, errori
  # JS, tabelle che fanno scorrere di lato tutto il documento, e il cronometro
  # del DS200 che avanza da solo. Nessuno di questi difetti compare in un diff
  # o in un test di parser — e tutti e quattro ci sono già passati sotto il naso.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installa Chromium per Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i -D playwright >/dev/null
          npx playwright install --with-deps chromium
      - name: Servi il sito
        run: |
          cd web && python3 -m http.server 8099 &
          for i in $(seq 1 30); do curl -sf http://localhost:8099/ >/dev/null && break; sleep 1; done
      - name: Tutte le app (link, i18n, errori JS, schermo stretto)
        run: node tools/smoke-test.js
      - name: Una gara dentro il cronometro
        run: node tools/test-cronometro.js
      - name: Contagiri DS200/DS300 (il numero non avanza da solo)
        run: node tools/test-ds200-ui.js
      - name: Contagiri Ninco
        run: node tools/test-ninco-ui.js
      - name: Configuratore dongle
        run: node tools/test-o2bootloader.js

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('esp32/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      # Il firmware serve il Cronometro web VERO da LittleFS: lo copia questo
      # script ad ogni build. Se si rompe, `pio run` fallirebbe comunque — ma
      # qui l'errore si legge, invece di essere sepolto nell'output di PlatformIO.
      # ⚠️ Si lancia come uno SCRIPT NORMALE, cioè nel modo in cui NON lo lancia
      # PlatformIO. Serve per avere l'errore in chiaro, ma la prova che conta è
      # `pio run` qui sotto: la prima versione di questo controllo usava `runpy`
      # e passava, mentre la build vera moriva su un `__file__` che sotto SCons
      # non esiste. Un controllo che esegue il codice in un modo diverso da
      # quello di produzione non sta controllando la stessa cosa.
      - name: La copia della web app per LittleFS
        run: |
          cd esp32
          python scripts/copy_webapp.py
          test -f data/cronometro/index.html
          test -f data/ui.css
          test -f data/ds200-ds300/ds200.js
          test ! -f data/cronometro/sw.js      # la cache-first non va sul dispositivo

      - name: Build firmware ESP32
        run: |
          python -m pip install --upgrade pip platformio
          cd esp32 && pio run
