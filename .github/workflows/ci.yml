name: CI

# Test veloci sui parser del contagiri DS200/DS300 (nessun hardware richiesto).
# Il parser JS (web/ds200/ds200.js) e quello C++ (esp32/src/ds200.h) devono restare
# equivalenti byte-per-byte: se tocchi il protocollo, aggiorna entrambi + i test.

on:
  push:
    branches: [master, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  # Il sito sta in un sottopercorso di github.io: un link assoluto o una card che
  # punta a una cartella inesistente si vedrebbero solo in produzione. Qui no.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Link interni + patch locali
        run: |
          node tools/check-links.js
          python3 tools/apply-local-patches.py --check

  parsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parser JS DS200 (web/ds200/ds200.js)
        run: node web/ds200/ds200.test.js

      - name: Parser JS Ninco (web/ninco/ninco.js)
        run: node web/ninco/ninco.test.js

      - name: Parser C++ (esp32/src/ds200.h)
        run: |
          g++ -std=c++17 -I esp32/test_host -I esp32/src \
              esp32/test_host/test_ds200.cpp -o /tmp/test_ds200
          /tmp/test_ds200

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('esp32/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Build firmware ESP32
        run: |
          python -m pip install --upgrade pip platformio
          cd esp32 && pio run
