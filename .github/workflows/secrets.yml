name: Scansione segreti

# Controlla che in questa repo PUBBLICA non siano finiti segreti: password del WiFi,
# chiavi, token, indirizzi MAC personali. Guarda sia i file di adesso sia TUTTA la
# storia, perche' un segreto committato e poi cancellato resta comunque leggibile.
#
# Se trova qualcosa il job FALLISCE: GitHub manda la mail di notifica al proprietario
# della repo, che e' l'avviso che serve.
#
# I valori personali (i tuoi MAC, la tua password) NON stanno nel codice: si mettono
# in un GitHub Secret chiamato SECRET_SCAN_EXTRA, una espressione regolare per riga.
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   nome: SECRET_SCAN_EXTRA
#   valore (esempio, una per riga):
#       XX:XX:XX:XX:XX:XX     <- il MAC del TUO dongle, in esadecimale
#       laMiaPasswordWiFi
#       mia\.mail@example\.com
# Se il secret non esiste, restano attive le regole generiche e va bene lo stesso.
# I valori trovati vengono sempre stampati mascherati: il log della Action e' pubblico.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Un giro a settimana: intercetta anche le regole nuove su codice vecchio.
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # serve tutta la storia per lo scan storico

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test delle regole
        run: python3 tools/test-scan-secrets.py

      - name: Segreti nei file attuali
        id: tree
        env:
          SECRET_SCAN_EXTRA: ${{ secrets.SECRET_SCAN_EXTRA }}
        run: python3 tools/scan-secrets.py

      - name: Segreti nella storia del repo
        id: history
        if: always()
        env:
          SECRET_SCAN_EXTRA: ${{ secrets.SECRET_SCAN_EXTRA }}
        run: python3 tools/scan-secrets.py --history

      - name: Riepilogo
        if: always()
        run: |
          if [ "${{ steps.tree.outcome }}" = "success" ] && [ "${{ steps.history.outcome }}" = "success" ]; then
            echo "✅ Nessun segreto trovato, ne' nei file attuali ne' nella storia." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## 🚨 Possibili segreti nella repo"
              echo ""
              echo "| controllo | esito |"
              echo "|---|---|"
              echo "| file attuali | ${{ steps.tree.outcome }} |"
              echo "| storia git   | ${{ steps.history.outcome }} |"
              echo ""
              echo "I dettagli (con i valori **mascherati**) sono nel log dei rispettivi step."
              echo ""
              echo "**Se è un segreto vero**: toglilo dal file, spostalo in un \`.env\` locale o nei"
              echo "GitHub Secrets e **cambia la credenziale** — va considerata compromessa, perché"
              echo "questa repo è pubblica. Se è già nella storia, ripulirla richiede una riscrittura"
              echo "(\`git filter-repo\`) e comunque la credenziale va cambiata lo stesso."
              echo ""
              echo "**Se è un falso allarme**: aggiungi una regex in \`tools/secret-scan-allow.txt\`"
              echo "oppure il commento \`allow-secret\` sulla riga."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fallisci se ci sono segreti
        if: always() && (steps.tree.outcome != 'success' || steps.history.outcome != 'success')
        run: exit 1
