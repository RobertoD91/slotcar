<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Configuratore auto oXigen (BLE)</title>
<link rel="stylesheet" href="../ui.css">
<style>
  /* Qui dentro solo quello che è di QUESTA pagina: intestazione, riquadri,
     pulsanti, campi, targhette e registro stanno in ../ui.css. */
  :root{--wrap:820px}
  label{min-width:110px}
  /* Il clone riscrive il MAC: è l'avviso più grave della pagina, e il giallo
     che basta agli altri avvisi qui direbbe troppo poco. */
  .warnbox{color:var(--err)}
  .dot{width:16px;height:16px;border-radius:50%;background:var(--bd);display:inline-block;transition:background .1s,box-shadow .1s}
  .dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
  /* slider disattivati visivamente quando Limiti è off (ma sempre editabili) */
  #limbox.off .lim input[type=range]{accent-color:var(--mut)}
  #limbox.off .lim label,#limbox.off .lim .val{opacity:.55}
  #limbox.off .lim .hint{color:var(--err)}
</style>
</head>
<body class="app">
  <div id="nobt" class="banner nope" hidden data-i18n-html="noBt"></div>
  <div id="upd" class="banner upd" hidden><span data-i18n="updateAvail"></span> <button onclick="reloadFresh()" data-i18n="updateBtn"></button></div>
  <a class="back" href="../" data-i18n="backHome"></a>
  <div class="note" data-i18n-html="oxigenBroken"></div>
  <h1><span data-i18n="h1title"></span> <span id="st" class="pill"></span></h1>
  <p class="sub" data-i18n-html="sub"></p>

  <div class="card">
    <div class="row">
      <button id="btnConn" data-i18n="btnConn"></button>
      <button id="btnDisc" class="sec" disabled data-i18n="btnDisc"></button>
      <span id="devname" class="val"></span>
    </div>
  </div>

  <!-- ===== Configurazione ===== -->
  <div class="card">
    <p class="cardtitle" data-i18n="secConfig"></p>
    <div class="row"><button id="btnReadAll" class="sec" disabled data-i18n="btnReadAll"></button>
      <span class="hint" data-i18n="readAllHint"></span></div>
    <div class="row"><label data-i18n="lblName"></label><input id="cName" size="16" maxlength="14" data-i18n-attr="placeholder:phName">
      <button class="sec cfg" data-fn="name" disabled data-i18n="btnSet"></button></div>
    <div class="row"><label data-i18n="lblCarId"></label><input id="cId" type="number" min="1" max="20" style="width:80px">
      <button class="sec cfg" data-fn="id" disabled data-i18n="btnSet"></button></div>
    <div class="row"><label data-i18n="lblMode"></label>
      <select id="cMode">
        <option value="" data-i18n="optReadCfg"></option>
        <option value="0">SSD puro</option>
        <option value="1">SSD ibrido</option>
        <option value="2">oXigen puro</option>
        <option value="3">oXigen ibrido</option>
        <option value="4">Carrera puro</option>
        <option value="5">Carrera ibrido</option>
      </select>
      <button class="sec cfg" data-fn="mode" disabled data-i18n="btnSet"></button></div>
    <div class="hint" data-i18n-html="modeHint"></div>
  </div>

  <!-- ===== Limiti + slider ===== -->
  <div class="card" id="limbox">
    <p class="cardtitle" data-i18n="secLimits"></p>
    <div class="row"><label data-i18n="lblLimits"></label><input id="cLimits" type="checkbox">
      <button class="sec cfg" data-fn="limits" disabled data-i18n="btnSet"></button></div>
    <div class="lim">
      <div class="row"><label data-i18n="lblMaxSpeed"></label><input id="cSpeed" type="range" min="0" max="255" style="flex:1;min-width:150px">
        <span id="cSpeedV" class="val">–</span><button class="sec cfg" data-fn="speed" disabled data-i18n="btnSet"></button></div>
      <div class="row"><label data-i18n="lblMinSpeed"></label><input id="cMinSpeed" type="range" min="0" max="255" style="flex:1;min-width:150px">
        <span id="cMinSpeedV" class="val">–</span><button class="sec cfg" data-fn="minspeed" disabled data-i18n="btnSet"></button></div>
      <div class="row"><label data-i18n="lblBrake"></label><input id="cBrake" type="range" min="0" max="255" style="flex:1;min-width:150px">
        <span id="cBrakeV" class="val">–</span><button class="sec cfg" data-fn="brake" disabled data-i18n="btnSet"></button></div>
      <div class="hint lim-hint" data-i18n-html="limHint"></div>
    </div>
  </div>

  <!-- ===== Test (motore/luci/hall) ===== -->
  <div class="card">
    <p class="cardtitle" data-i18n="secTest"></p>
    <div class="row">
      <button class="sec act" data-fn="motor" disabled data-i18n="btnMotor"></button>
      <button class="sec act" data-fn="lights" disabled data-i18n="btnLights"></button>
    </div>
    <div class="row"><label data-i18n="lblHall"></label><span id="hallDot" class="dot"></span>
      <span class="val"><span data-i18n="hallLbl"></span> <b id="hallN">0</b></span>
      <button id="hallReset" class="sec" disabled data-i18n="btnReset"></button></div>
    <div class="hint" data-i18n-html="hallHint"></div>
  </div>

  <!-- ===== Clonazione MAC ===== -->
  <div class="card">
    <p class="cardtitle" data-i18n="secClone"></p>
    <div class="row"><label data-i18n="lblMac"></label><input id="cMac" size="6" inputmode="latin" autocomplete="off" spellcheck="false" placeholder="1A2B" aria-describedby="macHint">
      <button class="warn act" data-fn="mac" disabled data-i18n="btnWriteMac"></button>
      <button class="sec act" data-fn="rstmac" disabled data-i18n="btnRstMac"></button></div>
    <div class="warnbox" data-i18n-html="cloneWarn"></div>
  </div>

  <!-- ===== Avanzato ===== -->
  <div class="card">
    <details><summary style="cursor:pointer;color:var(--mut)" data-i18n="advSummary"></summary>
      <div class="row" style="margin-top:8px"><label data-i18n="lblReadReg"></label><input id="rReg" size="6" placeholder="0x8f">
        <button class="sec cfg" data-fn="rawread" disabled data-i18n="btnRead"></button></div>
      <div class="row"><label data-i18n="lblWriteReg"></label><input id="wReg" size="6" placeholder="0x84"><input id="wVal" size="14" data-i18n-attr="placeholder:phWriteVal">
        <button class="sec cfg" data-fn="rawwrite" disabled data-i18n="btnWrite"></button></div>
      <table id="regtab" style="margin-top:8px"><thead><tr><th>reg</th><th data-i18n="thName"></th><th data-i18n="thValue"></th><th></th></tr></thead><tbody></tbody></table>
    </details>
  </div>

  <div class="card"><details><summary style="cursor:pointer;color:var(--mut)" data-i18n="advLog"></summary><div id="log"></div></details></div>

<script src="../i18n.js"></script>
<script>
const APP="car-config",APP_VERSION="1.4.0";
const NUS="6e400001-b5a3-f393-e0a9-e50e24dcca9e",RX="6e400002-b5a3-f393-e0a9-e50e24dcca9e",TX="6e400003-b5a3-f393-e0a9-e50e24dcca9e";
/* Registri con i NOMI UFFICIALI del firmware (OPCODE_*). 0x80 = DFU: non esposto apposta. */
const REGS=[
  [0x00,"SW_REL — versione sw"],
  [0x01,"CHIP_MAC — MAC del chip (sola lettura)"],
  [0x81,"ACT_DATE — data attivazione"],
  [0x82,"ACT_LOCK — blocco attivazione"],
  [0x83,"ACT_NAME — nome"],
  [0x84,"CAR_SPD_MAX — velocità max"],
  [0x85,"CAR_SPD_MIN — velocità min"],
  [0x86,"CAR_BRK_VLE — freno"],
  [0x87,"CAR_DATA_FROM — 0 telecomando / 1 auto"],
  [0x8d,"CAR_BRK_VLE_SSD — freno in SSD"],
  [0x8e,"CAR_MODE — tipo firmware (0 oXigen / 1 SSD / 2 D132)"],
  [0x8f,"CAR_ID — ID auto"],
  [0x90,"DEV_O2_MAC — telecomando abbinato (hi, lo)"],
  [0x91,"CAR_LED_MODE — modalità LED IR"],
  [0x94,"CAR_IR_TMR_FN — timer IR ibrido (ms)"],
  [0x95,"CAR_D132_LN_ID — corsia D132"],
  [0x9f,"RST_O2_MAC — ripristina abbinamento di fabbrica"],
  [0xa1,"SP44_SET — kit luci SP44 (0 off / 1 on)"]
];
let dev,rxc,txc,waiter=null,hallN=0,hallT=null;
const $=id=>document.getElementById(id);
const hx=b=>[...b].map(x=>x.toString(16).padStart(2,"0")).join("");
const asc=b=>[...b].map(x=>x>=32&&x<127?String.fromCharCode(x):".").join("");
const log=s=>{const l=$("log");l.textContent+=s+"\n";l.scrollTop=l.scrollHeight;};
const xorsum=a=>{let x=0;for(const b of a)x^=b;return x&0xff;};
const h2=n=>"0x"+n.toString(16).padStart(2,"0");

let _conn=false;
function renderStatus(){$("st").textContent=I18N.t(_conn?"stConnected":"stDisconnected");}
function setConn(on){_conn=on;renderStatus();$("st").className="pill"+(on?" on":"");
  $("btnConn").disabled=on;$("btnDisc").disabled=!on;
  document.querySelectorAll(".cfg,.act,#btnReadAll,#hallReset").forEach(b=>b.disabled=!on);}
async function connect(){
  if(!navigator.bluetooth){log(I18N.t("logNoBt"));return;}
  try{
    dev=await navigator.bluetooth.requestDevice({filters:[{services:[NUS]}],optionalServices:[NUS]});
    dev.addEventListener("gattserverdisconnected",()=>{setConn(false);$("devname").textContent="";log("["+I18N.t("logDisconnected")+"]");});
    const g=await dev.gatt.connect(),s=await g.getPrimaryService(NUS);
    rxc=await s.getCharacteristic(RX);txc=await s.getCharacteristic(TX);
    await txc.startNotifications();txc.addEventListener("characteristicvaluechanged",onNotify);
    setConn(true);$("devname").textContent=dev.name||dev.id;log("["+I18N.t("logConnectedTo")+" "+(dev.name||dev.id)+"]");
  }catch(e){log("["+I18N.t("logError")+": "+e+"]");}
}
function onNotify(e){
  const v=new Uint8Array(e.target.value.buffer);
  if(v.length>=3&&v[0]===0x09&&v[1]===0x02&&v[2]===0x9c){flashHall();return;}  // impulso giro
  log("  <- "+hx(v)+"  |"+asc(v)+"|"+(hx(v)==="444f"?"  (DO=ok)":""));
  if(waiter){waiter(v);waiter=null;}
}
const wait=(ms=1200)=>new Promise(r=>{waiter=r;setTimeout(()=>{if(waiter){waiter=null;r(null);}},ms);});
const send=b=>rxc.writeValueWithoutResponse(new Uint8Array(b));
async function readReg(reg){log("READ "+h2(reg));await send([0x09,0x12,reg]);return await wait();}
async function writeReg(reg,val){const body=[0x09,0x02,reg,...val];body.push(xorsum(body));
  log("WRITE "+h2(reg)+" = "+hx(val)+(asc(val).match(/^[ -~]+$/)?" |"+asc(val)+"|":""));await send(body);return await wait();}

/* hall live indicator */
function flashHall(){hallN++;$("hallN").textContent=hallN;const d=$("hallDot");d.classList.add("on");
  clearTimeout(hallT);hallT=setTimeout(()=>d.classList.remove("on"),300);log("🏁 "+I18N.t("logLapPulse")+" ("+hallN+")");}
$("hallReset").onclick=()=>{hallN=0;$("hallN").textContent="0";};

/* limiti: stile "off" sugli slider */
function refreshLim(){$("limbox").classList.toggle("off",!$("cLimits").checked);}
$("cLimits").addEventListener("change",refreshLim);refreshLim();

/* leggi tutta la config e popola i campi */
async function readAll(){
  for(const[r]of REGS){const v=await readReg(r);const c=$("v"+r);if(c)c.textContent=v?hx(v)+" |"+asc(v)+"|":I18N.t("noResp");
    if(v){
      if(r===0x83)$("cName").value=asc(v).replace(/\.+$/,"");
      if(r===0x8f)$("cId").value=v[0];
      if(r===0x91)$("cMode").value=String(v[0]);
      if(r===0x84){$("cSpeed").value=v[0];$("cSpeedV").textContent=v[0];}
      if(r===0x85){$("cMinSpeed").value=v[0];$("cMinSpeedV").textContent=v[0];}
      if(r===0x86){$("cBrake").value=v[0];$("cBrakeV").textContent=v[0];}
      if(r===0x87){$("cLimits").checked=v[0]!==0;refreshLim();}
      if(r===0x90){$("cMac").value=hx(v);$("cMac").dispatchEvent(new Event("input"));}
    }
    await new Promise(x=>setTimeout(x,110));
  }
}
function parseVal(s){s=(s||"").trim();
  if(/^0x[0-9a-f]{2}$/i.test(s))return[parseInt(s,16)];
  const hexs=s.replace(/ /g,"");
  if(/^[0-9a-f]+$/i.test(hexs)&&hexs.length%2===0&&hexs.length>=2)return[...hexs.matchAll(/../g)].map(m=>parseInt(m[0],16));
  if(/^\d+$/.test(s))return[parseInt(s)&0xff];
  return[...new TextEncoder().encode(s)];}
const fns={
  name:()=>writeReg(0x83,[...new TextEncoder().encode($("cName").value)]),
  id:()=>writeReg(0x8f,[Math.max(1,Math.min(20,parseInt($("cId").value)||1))]),
  mode:()=>{const m=$("cMode").value;if(m==="")return alert(I18N.t("alertMode"));return writeReg(0x91,[parseInt(m)]);},
  speed:()=>writeReg(0x84,[+$("cSpeed").value]),
  minspeed:()=>writeReg(0x85,[+$("cMinSpeed").value]),
  brake:()=>writeReg(0x86,[+$("cBrake").value]),
  limits:()=>writeReg(0x87,[$("cLimits").checked?1:0]),
  motor:()=>writeReg(0x9a,[0x00]),
  lights:()=>writeReg(0x9b,[0x00]),
  mac:()=>{const b=parseVal($("cMac").value);if(b.length!==2)return alert(I18N.t("alertMac"));
    if(confirm(I18N.t("confirmMac")))return writeReg(0x90,b);},
  /* 0x9f = RST_O2_MAC: il firmware rimette controller_ID dai byte del MAC del chip (de-clone). */
  rstmac:()=>{if(confirm(I18N.t("confirmRstMac")))return writeReg(0x9f,[0x00]);},
  rawread:async()=>{const r=parseInt($("rReg").value,16);if(!isNaN(r))await readReg(r);},
  rawwrite:async()=>{const r=parseInt($("wReg").value,16);if(!isNaN(r))await writeReg(r,parseVal($("wVal").value));},
};
document.querySelectorAll(".cfg,.act").forEach(b=>b.onclick=()=>fns[b.dataset.fn]&&fns[b.dataset.fn]());
$("cSpeed").oninput=e=>$("cSpeedV").textContent=e.target.value;
$("cBrake").oninput=e=>$("cBrakeV").textContent=e.target.value;
$("cMinSpeed").oninput=e=>$("cMinSpeedV").textContent=e.target.value;
(function(){const tb=$("regtab").querySelector("tbody");for(const[r,n]of REGS){const tr=document.createElement("tr");
  tr.innerHTML=`<td><code>${h2(r)}</code></td><td>${n}</td><td class="val" id="v${r}"></td>
    <td><button class="sec" disabled data-i18n="btnReadLc"></button></td>`;tb.appendChild(tr);
  const bt=tr.querySelector("button");bt.classList.add("cfg");
  bt.onclick=async()=>{const v=await readReg(r);$("v"+r).textContent=v?hx(v)+" |"+asc(v)+"|":I18N.t("noResp");};}})();

$("btnConn").onclick=connect;
$("btnDisc").onclick=()=>{if(dev&&dev.gatt.connected)dev.gatt.disconnect();};
$("btnReadAll").onclick=readAll;
// banner compatibilità Web Bluetooth
if(!navigator.bluetooth){$("nobt").style.display="block";$("btnConn").disabled=true;
  log(I18N.t("logNoBtInit"));}
// service worker network-first: sempre l'ultima versione (fix cache)
if("serviceWorker" in navigator)navigator.serviceWorker.register("../sw.js").catch(()=>{});

/* stato connessione: render iniziale (dopo l'init di i18n) + ri-render al cambio lingua */
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",renderStatus);
else renderStatus();
document.addEventListener("i18n:changed",renderStatus);

/* prompt aggiornamento versione */
function reloadFresh(){location.href=location.pathname+"?v="+Date.now();}
fetch("../version.json?_="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(j=>{
  if(j.apps&&j.apps[APP]&&j.apps[APP]!==APP_VERSION)$("upd").style.display="block";}).catch(()=>{});

/* Il MAC O2 è 2 byte = ESATTAMENTE 4 cifre esadecimali. Il campo non si lascia
   riempire di altro: filtra i caratteri non validi e si ferma a quattro, così
   il valore sbagliato non si può nemmeno digitare. Se resta incompleto il bordo
   diventa rosso, e la funzione di scrittura rifiuta comunque (alertMac).
   ⚠️ Il pulsante NON viene toccato qui: la sua abilitazione dipende dalla
   connessione (vedi setConn), e metterci le mani lo riaccenderebbe da scollegato. */
(function(){
  const c=document.getElementById("cMac"); if(!c)return;
  const valido=()=>/^[0-9A-F]{4}$/.test(c.value);
  function check(){
    c.value=c.value.replace(/[^0-9a-fA-F]/g,"").slice(0,4).toUpperCase();
    c.style.borderColor=(c.value.length&&!valido())?"var(--err)":"";
  }
  c.addEventListener("input",check); c.addEventListener("blur",check); check();
})();
</script>
