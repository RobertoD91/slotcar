<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spostato → Contagiri DS200 / DS300</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="../ds200-ds300/">
<meta http-equiv="refresh" content="3; url=../ds200-ds300/">
<style>
  /* stile-autonomo: questa pagina disinstalla un service worker CACHE-FIRST e
     poi reindirizza. Non può dipendere da ../ui.css: il foglio arriverebbe
     proprio dal service worker che stiamo togliendo, e se la cache è vecchia
     o rotta la pagina resta senza stile — o peggio, non si vede. Sette colori
     scritti a mano sono il prezzo di una rete di sicurezza che non ha reti di
     sicurezza. Si cancella tutto insieme quando si cancella la pagina. */
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font:16px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;background:#0f1115;color:#e9edf3;padding:24px}
  @media (prefers-color-scheme:light){body{background:#f6f7f9;color:#1a1d23}}
  .box{max-width:460px;text-align:center}
  a{display:inline-block;background:#5db0ff;color:#04121f;text-decoration:none;font-weight:700;
    padding:10px 18px;border-radius:10px;margin-top:14px}
  small{display:block;margin-top:14px;color:#8a94a6;font-size:13px}
</style>
</head>
<body>
  <div class="box">
    <h1>⏱️ Il contagiri si è spostato</h1>
    <p>Ora sta in <b>ds200-ds300/</b>, e l'installer dell'ESP32 ha una pagina sua.</p>
    <a href="../ds200-ds300/">Vai al contagiri →</a>
    <small>Reindirizzamento in corso…</small>
  </div>
<script>
/* Questa pagina esiste SOLO come rete di sicurezza, e si può cancellare fra qualche mese.
   L'app stava qui ed è una PWA con service worker CACHE-FIRST: chi l'aveva aperta ha un SW
   registrato su questo percorso che continuerebbe a servire la copia in cache, senza mai
   vedere che l'app si è spostata. Quindi prima lo disinstalliamo e svuotiamo le cache. */
var jobs = [];
try {
  if ("serviceWorker" in navigator) {
    jobs.push(navigator.serviceWorker.getRegistrations()
      .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
      .catch(function () {}));
  }
  if (window.caches && caches.keys) {
    jobs.push(caches.keys()
      .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
      .catch(function () {}));
  }
} catch (e) {}
var done = false;
function go(){ if (!done) { done = true; location.replace("../ds200-ds300/"); } }
Promise.all(jobs).then(go).catch(go);
setTimeout(go, 2000);   /* non restiamo appesi se qualcosa non risponde */
</script>
</body>
</html>
