<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title data-i18n="h1title">Contagiri gara (chron02) — Slot Car Web Tools</title>
<link rel="stylesheet" href="../ui.css">
<style>
  /* Qui dentro solo quello che è di QUESTA pagina: la cornice sta in ../ui.css. */
  :root{--wrap:920px}
  label{min-width:120px}
  select{max-width:100%}
  .timer{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:30px;font-weight:700;letter-spacing:1px}
  /* La tabella della gara ha molte colonne strette: scorre nel suo riquadro,
     altrimenti a scorrere di lato è tutta la pagina. */
  table{font-size:12.5px;min-width:560px}
  table.lim{min-width:0}
  td,th{padding:5px 7px;white-space:nowrap}
  td.num,th.num{text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace}
  /* Barra del grilletto: si legge di colpo, il numero no. */
  .tbar{display:inline-block;width:70px;height:9px;background:var(--bd);border-radius:5px;overflow:hidden;vertical-align:middle;margin-right:6px}
  .tbar>span{display:block;height:100%;background:var(--acc)}
  .empty{color:var(--mut);font-size:13px;padding:6px 2px}
  /* Lo stato che il dongle sta trasmettendo adesso. */
  .rs[aria-pressed="true"]{outline:2px solid var(--acc);outline-offset:2px}
  /* Giri arrivati ma scartati (STOP, PAUSA, ripresa): restano visibili, smorzati. */
  tr.lapx td{color:var(--mut)}
  #ccMsg:empty,#ccPrev:empty{display:none}
</style>
</head>
<body class="app">
  <div id="nobt" class="banner nope" hidden data-i18n-html="noSerial"></div>
  <div id="notact" class="banner nope" hidden data-i18n-html="notActBanner"></div>
  <div id="nover" class="banner error" hidden data-i18n-html="noVerBanner"></div>
  <div id="upd" class="banner upd" hidden><span data-i18n="updateAvail"></span> <button onclick="reloadFresh()" data-i18n="updateBtn"></button></div>
  <a class="back" href="../">← Slot Car Web Tools</a>
  <div class="note" data-i18n-html="oxigenUntested"></div>
  <h1><span data-i18n="h1title"></span> <span id="st" class="pill"></span></h1>
  <p class="sub" data-i18n-html="sub"></p>

  <div class="card"><div class="row">
    <button id="btnConn" data-i18n="btnConnectDongle"></button>
    <button id="btnDisc" class="sec" data-i18n="btnDisconnect" disabled></button>
    <span id="devname" class="val"></span>
    <span id="hs" class="pill" hidden></span>
  </div></div>

  <!-- ===== Controllo gara ===== -->
  <div class="card">
    <p class="cardtitle" data-i18n="titleRaceCtrl"></p>
    <div class="row">
      <button class="sec rs" data-st="free" data-i18n="rsFree" disabled></button>
      <button class="rs" data-st="run" data-i18n="rsStart" disabled></button>
      <button class="sec rs" data-st="pause" data-i18n="rsPause" disabled></button>
      <button class="warn rs" data-st="stop" data-i18n="rsStop" disabled></button>
      <button class="sec rs" data-st="pace" data-i18n="rsPace" disabled></button>
      <button class="sec rs" data-st="pacelc" data-i18n="rsPaceLc" disabled></button>
      <span id="stateP" class="pill" hidden></span>
    </div>
    <div id="syncHint" class="warnbox" data-i18n="needSync"></div>
    <div class="row"><label for="pitSel" data-i18n="lblPit"></label>
      <select id="pitSel">
        <option value="96" data-i18n="optPit60"></option>
        <option value="0" data-i18n="optPit00"></option>
        <option value="32" data-i18n="optPit20"></option>
      </select></div>
    <div class="row"><label for="rsMax" data-i18n="lblMaxSpeed"></label>
      <input id="rsMax" type="range" min="0" max="255" value="255" style="flex:1;min-width:150px">
      <span id="rsMaxV" class="val">255</span></div>
    <div class="row">
      <span class="timer" id="timerVal">00:00.00</span>
      <span class="val" data-i18n="lblTimer"></span>
    </div>
    <div class="row"><span class="val"><span data-i18n="txLabel"></span> <code id="txHex">–</code></span></div>
    <div class="warnbox" data-i18n-html="raceHint"></div>
  </div>

  <!-- ===== Limiti e comandi alle auto ===== -->
  <div class="card">
    <p class="cardtitle" data-i18n="titleCarCmd"></p>
    <div class="row">
      <label for="ccTo" data-i18n="lblTo"></label>
      <select id="ccTo">
        <option value="all" data-i18n="optToAll"></option>
        <option value="one" data-i18n="optToOne"></option>
      </select>
      <input id="ccId" type="number" min="1" max="24" step="1" value="1" style="width:70px" aria-label="ID" disabled>
    </div>
    <div class="row">
      <label for="ccCmd" data-i18n="lblCmd"></label>
      <select id="ccCmd">
        <option value="1" data-i18n="cmd1"></option>
        <option value="2" data-i18n="cmd2"></option>
        <option value="3" data-i18n="cmd3"></option>
        <option value="5" data-i18n="cmd5"></option>
        <option value="7" data-i18n="cmd7"></option>
        <option value="4" data-i18n="cmd4"></option>
      </select>
    </div>
    <div class="row">
      <label for="ccArg" data-i18n="lblArg"></label>
      <input id="ccArg" type="number" min="0" max="255" step="1" value="34" style="width:90px">
      <button id="ccSend" data-i18n="btnSend" disabled></button>
    </div>
    <div id="ccHint" class="hint"></div>
    <div id="ccPrev" class="val"></div>
    <div id="ccMsg" class="warnbox"></div>

    <p class="cardtitle" style="margin-top:14px" data-i18n="titleLimits"></p>
    <div class="tbwrap">
      <table class="lim"><thead><tr>
        <th data-i18n="thTo"></th><th data-i18n="thCmd"></th><th class="num" data-i18n="thVal"></th><th></th>
      </tr></thead><tbody id="limRows"></tbody></table>
    </div>
    <div id="limEmpty" class="empty" data-i18n="limEmpty"></div>
    <div class="warnbox" data-i18n-html="carCmdHint"></div>
  </div>

  <!-- ===== Classifica live ===== -->
  <div class="card">
    <p class="cardtitle" data-i18n="titleBoard"></p>
    <div class="row"><button id="btnReset" class="sec" data-i18n="btnResetData"></button></div>
    <div class="tbwrap">
      <table><thead><tr>
        <th class="num">#</th><th>ID</th>
        <th class="num" data-i18n="thLaps"></th>
        <th class="num" data-i18n="thLastLap"></th>
        <th class="num" data-i18n="thBestLap"></th>
        <th data-i18n="thTrigger"></th>
        <th data-i18n="thPit"></th>
        <th data-i18n-attr="title:thFlagsTitle">↑↓●</th>
        <th data-i18n="thVer"></th>
        <th data-i18n="thUpdate"></th>
      </tr></thead><tbody id="boardRows"></tbody></table>
    </div>
    <div id="boardEmpty" class="empty" data-i18n="boardEmpty"></div>
    <div class="warnbox" data-i18n-html="noteHint"></div>
  </div>

  <!-- ===== Log giri ===== -->
  <div class="card">
    <p class="cardtitle" data-i18n="titleLapLog"></p>
    <div class="tbwrap">
      <table><thead><tr>
        <th data-i18n="llWhen"></th><th>ID</th>
        <th class="num" data-i18n="llLapN"></th>
        <th class="num" data-i18n="llTime"></th>
        <th class="num" data-i18n="llCount"></th>
        <th data-i18n="llNote"></th>
      </tr></thead><tbody id="lapRows"></tbody></table>
    </div>
    <div id="lapEmpty" class="empty" data-i18n="lapLogEmpty"></div>
  </div>

  <!-- ===== Avanzate e registro ===== -->
  <div class="card">
    <details><summary style="cursor:pointer;color:var(--mut)" data-i18n="sumAdv"></summary>
      <div class="row"><label for="lapK" data-i18n="lblFactor"></label>
        <input id="lapK" type="number" min="50" max="200" step="0.01" value="99.25" style="width:100px"></div>
      <div class="hint" data-i18n-html="factorHint"></div>
      <div class="row"><label for="b7" data-i18n="lblB7"></label>
        <select id="b7">
          <option value="0" data-i18n="optB7trig"></option>
          <option value="128" data-i18n="optB7pwm"></option>
        </select></div>
      <div id="log" style="margin-top:8px"></div>
    </details>
  </div>

<!-- Il piè di tutte le pagine (ui.css): i18n.js ci mette il disclaimer, in fondo la versione. -->
<footer><p class="ver">v<span id="appver"></span></p></footer>

    en:"oXigen lap counter and race manager with the Slot.it USB dongle (<b>Web Serial</b>, VID 1FEE/PID 0002): it runs the race, sends limits to the controllers and shows live telemetry and leaderboard. <b>Only on your own hardware.</b>",

<script src="../i18n.js"></script>
<script>
const APP="chron02",APP_VERSION="1.4.1";
const VID=0x1fee,PID=0x0002;

/* ===== Protocollo, per quello che serve a questa pagina =====
 *
 * PC → dongle: un frame di 11 byte per scrittura. Il dongle legge i byte 0..7;
 * l'8, il 9 e il 10 li ignora e vanno a ZERO (vedi «aggancio» più sotto).
 *   [0] bit 0..4 stato gara, bit 5..7 giri in pit-lane
 *   [1] velocità massima      [2] ID dell'auto per il comando singolo (1..24)
 *   [3]/[4] comando per tutte e argomento (bit 7 del codice a 0)
 *   [5]/[6] comando per una sola auto e argomento (bit 7 del codice a 1)
 *   [7] bit 7: il campo grilletto riporta la media del PWM invece del grilletto
 *
 * Stati (bit 0..4 del byte 0). Il dongle parte in gara libera. Lo 0 vuol dire
 * «nessuna azione» ed è lecito; il 2 viene trattato come il 3, quindi non c'è un
 * pulsante a parte; un valore fuori elenco i telecomandi lo scartano (mai FFh). */
const ST={FREE:0x0F,STOP:0x01,RUN:0x03,PAUSE:0x04,PACE:0x05,PACE_LC:0x15};
const KEY_OF={free:ST.FREE,run:ST.RUN,pause:ST.PAUSE,stop:ST.STOP,pace:ST.PACE,pacelc:ST.PACE_LC};
const RUNNING=new Set([ST.RUN,ST.PACE,ST.PACE_LC]);   // auto in gara, cronometro acceso
const HALTED=new Set([ST.STOP,ST.PAUSE]);              // auto ferme, giri che non contano

const FRAME_LEN=11, MAX_WRITE=32;
const PUMP_MS=50;          // al massimo un frame ogni 50 ms: il dongle li tratta uno per volta
const KEEPALIVE_MS=1000;   // ripete lo stato corrente: è innocuo e copre un frame perso
const VER_TIMEOUT_MS=1000; // la versione arriva in pochi ms; dopo 1 s qualcosa non va
const FREE_HOLD_MS=600;    // pace car a velocità piena prima di tornare in gara libera
const GRACE_MS=600;        // tolleranza dopo Stop/Pausa per il giro appena chiuso
const RESUME_MS=1000;      // il primo dato dopo la ripresa porta i giri fatti in pausa
const ID_MIN=1, ID_MAX=24;
const LAPK_DEF=99.25;

/* Comandi ai telecomandi: codice → intervallo, valore neutro (quello che toglie
 * il limite) e valore proposto quando lo si sceglie. Il 6 non c'è apposta: i
 * telecomandi non lo gestiscono. */
const CMD={
  1:{max:255,neutral:null,sug:34},
  2:{max:255,neutral:255,sug:255},
  3:{max:255,neutral:0,sug:0},
  4:{max:3,neutral:3,sug:3,globalOnly:true},
  5:{max:255,neutral:255,sug:255},
  7:{max:255,neutral:0,sug:0},
};
const QUEUE_MAX=5;         // codici diversi per destinatario che il dongle tiene in coda

let port=null,writer=null,reader=null,reading=false,userClosing=false,wq=Promise.resolve();
let connState=false, phase="idle";   // idle | version | synced | nover | notact
let dongleVer="", verTimer=null, timers=[];
let raceSt=ST.FREE, holdUntil=0, dirty=false, bareNext=false, lastTxAt=0, lastLogged="";
let dongleRacing=false;              // il dongle ha già avuto un Avvia dopo l'ultimo Stop
let blockedSince=0, resumeAt=0;
let raceCs=0, lastTickMs=0, boardDirty=false;
let outQ=[];                         // comandi da mandare: {scope,id,code,arg,neutral}
let queued={g:new Set(),cars:{}};    // codici che il dongle ha in coda, per destinatario
const limits=new Map();              // limiti impostati dall'utente, da rimandare
const cars={};                       // id -> stato classifica
let lapLog=[];                       // {id,at,n,cnt,why}
let lapK=LAPK_DEF;

const $=id=>document.getElementById(id);
const hx=b=>[...b].map(x=>x.toString(16).padStart(2,"0")).join(" ");
const h2=x=>x.toString(16).padStart(2,"0");
const log=s=>{const l=$("log");l.textContent+=s+"\n";if(l.textContent.length>16000)l.textContent=l.textContent.slice(-8000);l.scrollTop=l.scrollHeight;};
const pad2=n=>String(n).padStart(2,"0");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmtLap=cnt=>cnt>0?(cnt/lapK).toFixed(2):"–";
const clock=t=>{const d=new Date(t);return pad2(d.getHours())+":"+pad2(d.getMinutes())+":"+pad2(d.getSeconds());};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

try{const v=parseFloat(localStorage.getItem("chron02.lapK"));if(v>=50&&v<=200)lapK=v;}catch(e){}

/* ---------- connessione ---------- */
function renderStatus(){const on=connState;$("st").textContent=on?I18N.t("stConnected"):I18N.t("stDisconnected");$("st").className="pill"+(on?" on":"");}
function setConn(on){connState=on;renderStatus();$("btnConn").disabled=on;$("btnDisc").disabled=!on;}

function setPhase(p){
  phase=p;
  const hs=$("hs");
  const m={version:["hsWait"," warn"],synced:["hsSynced"," on"],nover:["hsNoVer"," bad"],notact:["hsNotAct"," bad"]}[p];
  if(!m){hs.hidden=true;hs.textContent="";}
  else{hs.hidden=false;hs.textContent=I18N.t(m[0],{v:dongleVer});hs.className="pill"+m[1];}
  /* Le due fasce restano accese anche dopo Disconnetti: dicono cosa fare dopo,
     e una delle due ha il link al configuratore. Si spengono al nuovo avvio. */
  if(p!=="idle"){$("nover").hidden=(p!=="nover");$("notact").hidden=(p!=="notact");}
  renderRaceState();renderCmdUI();
}

async function connect(){
  if(!navigator.serial){$("nobt").style.display="block";return;}
  try{
    /* ⚠️ NIENTE filtro sul selettore delle porte.
       `requestPort({filters:[…]})` non "suggerisce" il dispositivo giusto: lo
       IMPONE, e il browser mostra soltanto chi combacia. Basta che il dongle
       si presenti con un VID/PID diverso — un adattatore seriale in mezzo, un
       bootloader diverso, un dongle di un'altra generazione — e la finestra
       esce VUOTA, senza spiegare niente. Quindi: mostriamo tutte le porte, e
       dopo diciamo se quella scelta ha l'aria giusta — un avviso, non un divieto. */
    port=await navigator.serial.requestPort();
    await port.open({baudRate:9600});      // il baud non conta: è una COM virtuale
    /* Senza DTR il dongle non legge e non scrive. */
    try{if(port.setSignals)await port.setSignals({dataTerminalReady:true});}
    catch(e){log(I18N.t("logDtr",{e:String(e)}));}
    writer=port.writable.getWriter();wq=Promise.resolve();
    const i=port.getInfo?port.getInfo():{};
    const atteso=(i.usbVendorId===VID&&i.usbProductId===PID);
    const idtxt=i.usbVendorId!=null
      ?("VID "+i.usbVendorId.toString(16).padStart(4,"0")+"/PID "+i.usbProductId.toString(16).padStart(4,"0"))
      :I18N.t("portNoId");
    $("devname").textContent=idtxt;
    resetSession();
    userClosing=false;setConn(true);log(I18N.t("logConnected"));
    log(atteso?I18N.t("portOk",{id:idtxt}):I18N.t("portOther",{id:idtxt}));
    readLoop();startTimers();
    /* Avvio: il PRIMO messaggio deve contenere un byte 0x06. Accende la radio
       verso i telecomandi e il dongle risponde con la versione; senza, la radio
       resta spenta. Un dongle non attivato risponde ACTIVENOT (o 2 byte). */
    setPhase("version");
    await write([0x06,0x06,0x06,0x06]);
    log("-> 06 06 06 06");
    verTimer=setTimeout(()=>{if(phase==="version"){setPhase("nover");log(I18N.t("logNoVer"));}},VER_TIMEOUT_MS);
  }catch(e){log("["+I18N.t("errWord")+": "+e+"]");}
}

/* Stato di una sessione: si riparte da zero ad ogni connessione, perché ogni
   avvio riuscito vuol dire un dongle appena acceso (gara libera, code vuote). */
function resetSession(){
  raceSt=ST.FREE;holdUntil=0;dirty=false;bareNext=false;lastTxAt=0;lastLogged="";
  dongleRacing=false;blockedSince=0;resumeAt=0;dongleVer="";
  outQ=[];queued={g:new Set(),cars:{}};
  $("txHex").textContent="–";
}

async function disconnect(){
  userClosing=true;
  try{
    /* Il dongle non ha timeout: chiuso il programma continuerebbe a trasmettere
       l'ultimo stato. Durante una gara si ferma tutto prima di andarsene. */
    if(phase==="synced"&&RUNNING.has(raceSt)){
      raceSt=ST.STOP;holdUntil=0;
      const b=buildFrame(null,null);
      await write(b);$("txHex").textContent=hx(b);log("-> "+hx(b));log(I18N.t("logStopOnDisc"));
      await sleep(80);
    }
  }catch(e){}
  await closePort();
  log(I18N.t("logDisconnected"));
}
async function closePort(){
  reading=false;stopTimers();
  try{if(reader)await reader.cancel().catch(()=>{});}catch(e){}
  try{if(writer)writer.releaseLock();}catch(e){}
  try{if(port)await port.close();}catch(e){}
  reader=writer=null;port=null;
  setConn(false);setPhase("idle");$("devname").textContent="";
}
async function readLoop(){
  reading=true;
  while(reading&&port&&port.readable){
    reader=port.readable.getReader();
    try{while(true){const{value,done}=await reader.read();if(done)break;if(value&&value.length)onMessage(value);}}
    catch(e){}finally{try{reader.releaseLock();}catch(e){}}
  }
  if(!userClosing&&connState){log(I18N.t("logLost"));await closePort();}
}
/* Al massimo 32 byte per scrittura: oltre, il dongle smette di seguire il PC
   finché non si riapre la porta, Stop compreso. Le scritture vanno in fila. */
function write(bytes){
  if(!writer)return Promise.resolve();
  if(bytes.length>MAX_WRITE){log(I18N.t("logTooLong",{n:bytes.length}));return Promise.resolve();}
  const w=writer,u=new Uint8Array(bytes);
  wq=wq.then(()=>w.write(u)).catch(e=>log("["+I18N.t("errWord")+": "+e+"]"));
  return wq;
}

/* ---------- timer: invio dei frame + cronometro ---------- */
function startTimers(){
  stopTimers();lastTickMs=Date.now();
  timers=[setInterval(pump,PUMP_MS),setInterval(tickClock,100),
          setInterval(()=>{if(boardDirty){boardDirty=false;renderBoard();}},250)];
}
function stopTimers(){timers.forEach(t=>clearInterval(t));timers=[];if(verTimer){clearTimeout(verTimer);verTimer=null;}}
function tickClock(){const now=Date.now();const dt=now-lastTickMs;lastTickMs=now;
  if(RUNNING.has(raceSt))raceCs+=dt/10;
  $("timerVal").textContent=fmtCs(raceCs);}
function fmtCs(cs){cs=Math.floor(cs);const c=cs%100,s=Math.floor(cs/100)%60,m=Math.floor(cs/6000);return pad2(m)+":"+pad2(s)+"."+pad2(c);}

/* ---------- TX: frame di gara ---------- */
const pitBits=()=>(+$("pitSel").value)&0xE0;
function buildFrame(g,i){
  const holding=holdUntil&&Date.now()<holdUntil;
  const st=holding?ST.PACE:raceSt;
  const b=new Array(FRAME_LEN).fill(0);              // 8..10 restano a zero
  b[0]=(st&0x1F)|pitBits();
  /* In gara libera il byte 1 non conta per i telecomandi: ci va FFh, così il
     frame contiene sempre il pattern di aggancio «0x0F, FFh» al byte 0. In Stop
     va 0, come fa il cronometro ufficiale (61 00 …). */
  b[1]=(st===ST.FREE||holding)?0xFF:st===ST.STOP?0x00:(+$("rsMax").value&0xFF);
  if(g){b[3]=g.code&0x7F;b[4]=g.arg&0xFF;}
  if(i){b[2]=i.id;b[5]=0x80|(i.code&0x7F);b[6]=i.arg&0xFF;}
  b[7]=(+$("b7").value)&0x80;
  return b;
}
function takeCmd(scope){const k=outQ.findIndex(q=>q.scope===scope);return k<0?null:outQ.splice(k,1)[0];}
function pump(){
  if(phase!=="synced"||!writer)return;
  const now=Date.now();
  if(now-lastTxAt<PUMP_MS-10)return;
  if(holdUntil&&now>=holdUntil){holdUntil=0;dirty=true;renderRaceState();}
  let g=null,i=null;
  if(!bareNext){g=takeCmd("g");i=takeCmd("i");}
  bareNext=false;
  if(!dirty&&!g&&!i&&now-lastTxAt<KEEPALIVE_MS)return;
  dirty=false;
  sendFrame(buildFrame(g,i));
}
function sendFrame(b){
  lastTxAt=Date.now();
  const s=hx(b);$("txHex").textContent=s;
  if(s!==lastLogged){log("-> "+s);lastLogged=s;}          // le ripetizioni identiche non intasano il registro
  return write(b);
}

/* Aggancio. Dopo la versione il dongle cerca nel frame un pattern: un byte con
   bit 0..4 = 0x0F seguito da FFh (oppure 0x61). Se lo trova più volte vince
   l'ULTIMO, e da lì prende l'allineamento dei frame successivi: per questo sta
   al byte 0, i comandi in questo primo frame non ci sono, e i byte 8..10 sono
   zero invece che un timer che potrebbe valere 0x06 o 0x61 per caso. */
function sendSync(){
  raceSt=ST.FREE;holdUntil=0;
  sendFrame(buildFrame(null,null));
  log(I18N.t("logSync"));
}

function setRaceState(kind){
  if(phase!=="synced")return;
  const st=KEY_OF[kind];if(st==null)return;
  const prev=raceSt, now=Date.now();
  holdUntil=0;
  /* Gara libera da Stop o Pausa: lì i telecomandi hanno velocità zero, e in gara
     libera tengono quella che avevano. Un passaggio breve in pace car a velocità
     piena la rimette al massimo; poi si va in gara libera. */
  if(st===ST.FREE&&(raceSt===ST.STOP||raceSt===ST.PAUSE))holdUntil=now+FREE_HOLD_MS;
  if(HALTED.has(st)&&!HALTED.has(prev))blockedSince=now;
  if(prev===ST.PAUSE&&!HALTED.has(st)){resumeAt=now;for(const k in cars)cars[k].resumePending=true;}
  let clears=false;
  if(st===ST.RUN&&!dongleRacing){clears=true;dongleRacing=true;}
  if(st===ST.STOP)dongleRacing=false;
  raceSt=st;dirty=true;
  if(clears){
    /* Avvia dopo Stop (o il primo Avvia): il dongle azzera giri, tempi e code
       dei comandi. Il frame di Avvia parte da solo, poi si rimandano i limiti. */
    newRace();bareNext=true;resendLimits();
  }
  renderRaceState();
  pump();
}
function renderRaceState(){
  const p=$("stateP"),synced=(phase==="synced");
  if(!synced){p.hidden=true;}
  else{
    const m={[ST.FREE]:["stFree",""],[ST.RUN]:["stRunning"," run"],[ST.PAUSE]:["stPaused"," pause"],
             [ST.STOP]:["stStopped"," stop"],[ST.PACE]:["stPace"," flag"],[ST.PACE_LC]:["stPaceLc"," flag"]}[raceSt]||["stFree",""];
    p.hidden=false;p.textContent=I18N.t(m[0]);p.className="pill"+m[1];
  }
  document.querySelectorAll(".rs").forEach(b=>{
    b.disabled=!synced;
    b.setAttribute("aria-pressed",String(synced&&KEY_OF[b.dataset.st]===raceSt));
  });
  $("syncHint").hidden=synced;
}

/* ---------- comandi ai telecomandi ---------- */
const limKey=(scope,id,code)=>scope==="g"?"g:"+code:"i:"+id+":"+code;
function carSet(id){return queued.cars[id]||(queued.cars[id]=new Set());}
/* Mette un comando in uscita. Controlla la coda del dongle (5 codici diversi per
   destinatario: il sesto lo butterebbe senza dirlo). Torna un errore o null. */
function enqueue(item,opts){
  opts=opts||{};
  const set=item.scope==="g"?queued.g:carSet(item.id);
  if(!set.has(item.code)&&set.size>=QUEUE_MAX)return I18N.t("errFull");
  set.add(item.code);
  /* La velocità minima per tutte azzera nel dongle quelle per auto: lo stesso
     codice entra nella coda di ogni auto, e i valori per auto non valgono più. */
  if(item.scope==="g"&&item.code===3){
    for(let id=ID_MIN;id<=ID_MAX;id++)carSet(id).add(3);
    if(!opts.resend)for(const k of [...limits.keys()])if(/^i:\d+:3$/.test(k))limits.delete(k);
    outQ=outQ.filter(q=>!(q.scope==="i"&&q.code===3));
  }
  const same=outQ.find(q=>q.scope===item.scope&&q.id===item.id&&q.code===item.code);
  if(same){same.arg=item.arg;same.neutral=item.neutral;}
  else outQ.push(Object.assign({},item));
  return null;
}
function resendLimits(){
  const keep=outQ.filter(q=>q.neutral);
  outQ=[];queued={g:new Set(),cars:{}};
  /* prima quelli per tutte: una velocità minima per tutte azzera quelle per auto */
  const all=[...keep,...limits.values()].sort((a,b)=>(a.scope==="g"?0:1)-(b.scope==="g"?0:1));
  for(const it of all)enqueue(it,{resend:true});
  if(all.length)log(I18N.t("logResend",{n:all.length}));
}
function describe(it){
  const who=it.scope==="g"?I18N.t("limAll"):I18N.t("limCar",{id:it.id});
  return I18N.t("cmd"+it.code)+" ("+who+") = "+it.arg;
}
function readTarget(){
  if($("ccTo").value==="all")return{scope:"g",id:0};
  const s=$("ccId").value.trim(),n=Number(s);
  if(!/^\d+$/.test(s)||n<ID_MIN||n>ID_MAX)return{err:I18N.t("errId",{id:s||"?"})};
  return{scope:"i",id:n};
}
function readArg(code){
  const s=$("ccArg").value.trim(),n=Number(s);
  if(!/^\d+$/.test(s)||n>CMD[code].max)return{err:I18N.t("errArg",{max:CMD[code].max})};
  return{arg:n};
}
function say(s,bad){const m=$("ccMsg");m.textContent=s;m.className=bad?"warnbox":"hint";}
function sendCmd(){
  if(phase!=="synced")return;
  const code=+$("ccCmd").value,t=readTarget();
  if(t.err)return say(t.err,true);
  const a=readArg(code);
  if(a.err)return say(a.err,true);
  if(CMD[code].globalOnly&&t.scope!=="g")return say(I18N.t("errPwrInd"),true);
  const it={scope:t.scope,id:t.id,code,arg:a.arg,neutral:a.arg===CMD[code].neutral};
  const err=enqueue(it);
  if(err)return say(err,true);
  const k=limKey(it.scope,it.id,code);
  if(it.neutral)limits.delete(k);else limits.set(k,{scope:it.scope,id:it.id,code,arg:it.arg});
  say(I18N.t("msgQueued",{what:describe(it)}),false);
  renderLimits();pump();
}
function dropLimit(k){
  const L=limits.get(k);if(!L)return;
  const nv=CMD[L.code].neutral;
  if(nv==null){limits.delete(k);say(I18N.t("msgDroppedPit",{what:describe(L)}),false);renderLimits();return;}
  const it={scope:L.scope,id:L.id,code:L.code,arg:nv,neutral:true};
  const err=enqueue(it);
  if(err)return say(err,true);
  limits.delete(k);
  say(I18N.t("msgDropped",{what:describe(L),v:nv}),false);
  renderLimits();pump();
}
function renderLimits(){
  const tb=$("limRows");tb.innerHTML="";
  const arr=[...limits.entries()].sort((a,b)=>(a[1].scope===b[1].scope?(a[1].id-b[1].id)||(a[1].code-b[1].code):a[1].scope==="g"?-1:1));
  $("limEmpty").hidden=arr.length>0;
  for(const [k,L] of arr){
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${L.scope==="g"?esc(I18N.t("limAll")):esc(I18N.t("limCar",{id:L.id}))}</td>`+
      `<td>${esc(I18N.t("cmd"+L.code))}</td><td class="num">${L.arg}</td>`+
      `<td><button class="sec" data-k="${esc(k)}">${esc(I18N.t("btnDrop"))}</button></td>`;
    tr.querySelector("button").disabled=(phase!=="synced");
    tr.querySelector("button").onclick=()=>dropLimit(k);
    tb.appendChild(tr);
  }
}
function renderCmdUI(){
  const code=+$("ccCmd").value,c=CMD[code],synced=(phase==="synced");
  if(c.globalOnly)$("ccTo").value="all";
  $("ccTo").disabled=!!c.globalOnly;
  $("ccId").disabled=($("ccTo").value==="all");
  $("ccArg").max=String(c.max);
  $("ccSend").disabled=!synced;
  $("ccHint").innerHTML=I18N.t("hint"+code);
  /* anteprima dei byte e dell'effetto, per i comandi che vanno decodificati */
  const t=readTarget(),a=readArg(code);let s="";
  if(!t.err&&!a.err){
    s=t.scope==="g"?I18N.t("prevG",{c:h2(code),a:h2(a.arg)}):I18N.t("prevI",{id:t.id,c:h2(0x80|code),a:h2(a.arg)});
    if(code===3)s+=I18N.t("prevMin",{v:(a.arg&0x3F)*4,lc:I18N.t(a.arg>63?"wordYes":"wordNo")});
    if(code===4)s+=I18N.t("prevPwr",{d:["−8","−4","0","+4"][a.arg]});
    if(code===7)s+=I18N.t("prevMinLap",{s:(a.arg/10).toFixed(1)});
  }
  $("ccPrev").textContent=s;
  renderLimits();
}

/* ---------- RX: si distingue per lunghezza e primo byte ----------
 * 13 o 26 byte = dati di 1 o 2 auto (primo byte con bit 7 a 1)
 *  5 byte      = versione «MAIN SUB 00 00 00»
 *  2 byte      = versione da un dongle non attivato
 *  9 byte      = risposta testuale (ACTIVENOT, …)
 * Ogni lettura è trattata come un messaggio a sé; se due arrivano attaccati si
 * separano col primo byte, e quello che non si riconosce si scarta, senza
 * trascinarlo nella lettura dopo. */
function onMessage(u8){
  let a=[...u8];
  while(a.length){
    if(a[0]&0x80){
      if(a.length<13){log(I18N.t("logUnknown",{n:a.length,hex:hx(a)}));break;}
      onCar(a.slice(0,13));a=a.slice(13);continue;
    }
    if(a[0]===0x41&&a.length>=9){                         // 'A': ACTIVENOT, ACTIVDONE, ACT+6…
      const tok=a.slice(0,9),s=String.fromCharCode(...tok.slice(0,3));
      const txt=s==="ACT"&&tok.slice(3).some(x=>x<32||x>126)?"ACT "+hx(tok.slice(3)):String.fromCharCode(...tok);
      if(txt==="ACTIVENOT")onNotActivated(I18N.t("logNotAct"));else log(I18N.t("logToken",{s:txt}));
      a=a.slice(9);continue;
    }
    if(a[0]===0x42&&a.length>=6&&String.fromCharCode(...a.slice(0,6))==="BOOTOK"){log(I18N.t("logToken",{s:"BOOTOK"}));a=a.slice(6);continue;}
    if(a[0]>=1&&a[0]<=15&&a.length>=5&&a[2]===0&&a[3]===0&&a[4]===0){onVersion(a[0],a[1]);a=a.slice(5);continue;}
    if(a[0]>=1&&a[0]<=15&&a.length===2){onNotActivated(I18N.t("logShortVer",{v:a[0]+"."+pad2(a[1])}));a=[];continue;}
    log(I18N.t("logUnknown",{n:a.length,hex:hx(a)}));break;
  }
}
function onVersion(main,sub){
  dongleVer=main+"."+pad2(sub);
  log("<- "+I18N.t("logVer",{v:dongleVer}));
  if(phase!=="version"&&phase!=="nover")return;
  if(verTimer){clearTimeout(verTimer);verTimer=null;}
  setPhase("synced");
  sendSync();
}
function onNotActivated(msg){
  log("<- "+msg);
  if(verTimer){clearTimeout(verTimer);verTimer=null;}
  if(phase!=="notact")setPhase("notact");
}

/* Dati di un'auto, 13 byte:
 *   [0] 80h + bit 0 telecomando riavviato, bit 1 collegamento con l'auto perso O
 *       ritrovato (un evento, non uno stato), bit 4 auto in pit-lane
 *   [1] ID 1..24        [2]/[3] ultimo tempo sul giro, conteggi, big-endian
 *   [4] sempre 0: non è una velocità, e non si mostra
 *   [5]/[6] giri, little-endian
 *   [7] bit 7 auto collegata, bit 0..6 media del grilletto (o del PWM) ÷ 2
 *   [8] versione: bit 7 a 0 telecomando, a 1 auto (80h = non ancora nota);
 *       negli altri bit (main−4)·32 + sub
 *   [9] bit 2 batteria scarica, bit 3 track call, bit 5/6 frecce su/giù,
 *       bit 7 pulsante tondo     [10..12] timer gara del dongle, centesimi */
function onCar(f){
  const id=f[1];
  if(id<ID_MIN||id>ID_MAX){log(I18N.t("logBadId",{id}));return;}
  const now=Date.now();
  const cnt=f[2]*256+f[3];
  const raw=f[5]|(f[6]<<8);
  let c=cars[id];
  if(!c){c={id,raw:undefined,discard:0,lastCnt:0,bestCnt:undefined,ctrlVer:null,carVer:null,resumePending:false};cars[id]=c;}
  const resumeHit=c.resumePending&&(now-resumeAt<=RESUME_MS);c.resumePending=false;
  /* Il numero di giri che manda il dongle non torna mai indietro, salvo quando
     lui stesso azzera (Avvia dopo Stop): allora si riparte da lì. */
  if(c.raw===undefined||raw<c.raw){c.raw=raw;c.discard=0;}
  else if(raw>c.raw){
    const d=raw-c.raw;c.raw=raw;
    let why=null;
    if(HALTED.has(raceSt)&&now-blockedSince>GRACE_MS)why=raceSt===ST.STOP?"Stop":"Pause";
    else if(resumeHit)why="Resume";
    if(why){c.discard+=d;pushLap({id,at:now,n:null,cnt,why});}
    else{
      c.lastCnt=cnt;
      if(cnt>0&&(c.bestCnt===undefined||cnt<c.bestCnt))c.bestCnt=cnt;
      pushLap({id,at:now,n:c.raw-c.discard,cnt,why:null});
    }
  }
  c.pit=(f[0]>>4)&1;c.reset=f[0]&1;c.link=(f[0]>>1)&1;
  c.connected=(f[7]>>7)&1;c.power=f[7]&0x7F;
  if(f[8]&0x80)c.carVer=f[8];else c.ctrlVer=f[8];
  c.batt=(f[9]>>2)&1;c.call=(f[9]>>3)&1;c.up=(f[9]>>5)&1;c.dn=(f[9]>>6)&1;c.round=(f[9]>>7)&1;
  c.raceT=(f[10]<<16)|(f[11]<<8)|f[12];
  c.at=now;
  boardDirty=true;
}
function pushLap(e){lapLog.push(e);if(lapLog.length>300)lapLog=lapLog.slice(-300);renderLapLog();}
/* Avvia dopo Stop: il dongle ricomincia da zero, la classifica anche. Il log
   giri resta: è la storia di quello che è arrivato. */
function newRace(){
  raceCs=0;
  for(const k in cars){const c=cars[k];c.raw=undefined;c.discard=0;c.lastCnt=0;c.bestCnt=undefined;c.resumePending=false;}
  boardDirty=true;
}

/* ---------- render classifica / log ---------- */
function verTxt(v){
  if(v==null)return null;
  const x=v&0x7F;
  if(x===0)return I18N.t("verUnknown");
  return (4+((x>>5)&3))+"."+pad2(x&0x1F);
}
function verCell(c){
  const p=[];
  const cv=verTxt(c.ctrlVer),av=verTxt(c.carVer);
  if(cv)p.push(`<span title="0x${h2(c.ctrlVer)}">🎮 ${esc(cv)}</span>`);
  if(av)p.push(`<span title="0x${h2(c.carVer)}">🚗 ${esc(av)}</span>`);
  return p.join(" ")||"–";
}
function flag(on,sym,key){return on?`<span title="${esc(I18N.t(key))}">${sym}</span>`:"";}
function btnCell(c){
  return flag(c.up,"↑","fUp")+flag(c.dn,"↓","fDn")+flag(c.round,"●","fRound")+
    flag(c.call," 🏳️","fCall")+flag(c.batt," 🔋","fBatt")+flag(c.reset," ⟲","fReset")+flag(c.link," ↯","fLink");
}
function trigCell(c){
  if(!c.connected)return `<span class="val">${esc(I18N.t("trigNoCar"))}</span>`;
  const pw=Math.round(c.power/127*100);
  return `<span class="tbar"><span style="width:${pw}%"></span></span>${c.power}`;
}
const counted=c=>c.raw===undefined?0:c.raw-c.discard;
function renderBoard(){
  const ids=Object.keys(cars);
  $("boardEmpty").hidden=ids.length>0;
  const arr=ids.map(k=>cars[k]).sort((a,b)=>{
    const la=counted(a),lb=counted(b);if(lb!==la)return lb-la;
    const ba=a.bestCnt===undefined?Infinity:a.bestCnt, bb=b.bestCnt===undefined?Infinity:b.bestCnt;
    return ba-bb||a.id-b.id;});
  const tb=$("boardRows");tb.innerHTML="";
  arr.forEach((c,idx)=>{
    const tr=document.createElement("tr");
    tr.dataset.id=c.id;
    const disc=c.discard?` <span class="val" title="${esc(I18N.t("fDisc"))}">(${c.discard})</span>`:"";
    tr.innerHTML=
      `<td class="num">${idx+1}</td>`+
      `<td>${c.id}</td>`+
      `<td class="num laps">${counted(c)}${disc}</td>`+
      `<td class="num">${fmtLap(c.lastCnt)}</td>`+
      `<td class="num best">${c.bestCnt===undefined?"–":fmtLap(c.bestCnt)}</td>`+
      `<td>${trigCell(c)}</td>`+
      `<td>${flag(c.pit,"🅿️","fPit")}</td>`+
      `<td>${btnCell(c)}</td>`+
      `<td class="kv">${verCell(c)}</td>`+
      `<td class="val">${clock(c.at)}</td>`;
    tb.appendChild(tr);
  });
}
function renderLapLog(){
  const tb=$("lapRows");tb.innerHTML="";
  $("lapEmpty").hidden=lapLog.length>0;
  lapLog.slice(-60).reverse().forEach(e=>{
    const tr=document.createElement("tr");
    if(e.why)tr.className="lapx";
    tr.innerHTML=`<td class="val">${clock(e.at)}</td><td>${e.id}</td>`+
      `<td class="num">${e.n==null?"–":e.n}</td><td class="num">${fmtLap(e.cnt)}</td>`+
      `<td class="num">${e.cnt}</td><td>${e.why?esc(I18N.t("lapDisc"+e.why)):""}</td>`;
    tb.appendChild(tr);
  });
}
function resetData(){for(const k in cars)delete cars[k];lapLog=[];raceCs=0;$("timerVal").textContent=fmtCs(0);renderBoard();renderLapLog();}

/* ---------- wiring ---------- */
$("btnConn").onclick=connect;$("btnDisc").onclick=disconnect;
document.querySelectorAll(".rs").forEach(b=>b.onclick=()=>setRaceState(b.dataset.st));
$("rsMax").oninput=e=>{$("rsMaxV").textContent=e.target.value;dirty=true;};
$("pitSel").onchange=()=>{dirty=true;};
$("b7").onchange=()=>{dirty=true;};
$("ccTo").onchange=renderCmdUI;
$("ccId").oninput=renderCmdUI;
$("ccArg").oninput=renderCmdUI;
$("ccCmd").onchange=()=>{$("ccArg").value=String(CMD[+$("ccCmd").value].sug);$("ccMsg").textContent="";renderCmdUI();};
$("ccSend").onclick=sendCmd;
$("btnReset").onclick=resetData;
$("lapK").value=String(lapK);
$("lapK").onchange=()=>{const v=parseFloat($("lapK").value);
  if(v>=50&&v<=200){lapK=v;try{localStorage.setItem("chron02.lapK",String(v));}catch(e){}}
  else $("lapK").value=String(lapK);
  renderBoard();renderLapLog();};
/* Pagina chiusa durante una gara: tentativo di Stop, senza garanzie. */
window.addEventListener("pagehide",()=>{if(phase==="synced"&&RUNNING.has(raceSt)){raceSt=ST.STOP;holdUntil=0;write(buildFrame(null,null));}});
try{if(navigator.serial&&navigator.serial.addEventListener)navigator.serial.addEventListener("disconnect",e=>{
  if(port&&e.target===port&&connState){userClosing=true;log(I18N.t("logLost"));closePort();}});}catch(e){}

/* ri-render del dinamico al cambio lingua */
function renderAll(){renderStatus();setPhase(phase);renderBoard();renderLapLog();}
document.addEventListener("i18n:changed",renderAll);
function boot(){renderAll();$("timerVal").textContent=fmtCs(0);}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();

/* compat + sw + versione */
if(!navigator.serial){$("nobt").style.display="block";$("btnConn").disabled=true;log(I18N.t("noSerialLog"));}
if("serviceWorker" in navigator)navigator.serviceWorker.register("../sw.js").catch(()=>{});
/* versione: nel piè, e la fascia «Aggiorna» se quella pubblicata è un'altra */
document.getElementById("appver").textContent=APP_VERSION;
function reloadFresh(){location.href=location.pathname+"?v="+Date.now();}
fetch("../version.json?_="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(j=>{
  if(j.apps&&j.apps[APP]&&j.apps[APP]!==APP_VERSION)document.getElementById("upd").hidden=false;}).catch(()=>{});
</script>
