<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ninco Digital — contagiri</title>

  :root{--wrap:900px}
  input,select{padding:6px 8px;font-size:13px}
  table{font-size:13.5px}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  td.n,th.n{text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace}
  tr.out{opacity:.4}
  .lead{color:var(--ok);font-weight:700}
  /* Il livello di benzina: la barra si legge da lontano, il numero da vicino. */
  .fuel{display:inline-block;width:52px;height:8px;border:1px solid var(--bd);border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:6px}
  .fuel i{display:block;height:100%;background:var(--ok)}
  .fuel.low i{background:var(--warn)}
  .res{color:var(--err);font-weight:600}
  #log{white-space:pre}
  .wire{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.7}
  details summary{cursor:pointer;color:var(--mut);font-size:13px}
</style>

<body class="app">
  <div id="noser" class="banner nope" hidden data-i18n-html="noSerial"></div>
  <a class="back" href="../">← Slot Car Web Tools</a>
  <h1><span data-i18n="h1">Ninco Digital — contagiri</span>
      <span id="st" class="pill"></span>
      <span id="mode" class="pill"></span></h1>
  <p class="sub" data-i18n-html="sub"></p>

  <!-- ===== Connessione ===== -->
  <div class="card">
    <p class="cardtitle" data-i18n="titleConn">Connessione</p>
    <div class="row">
      <button id="btnConn" data-i18n="btnConnect">🔌 Connetti</button>
      <button id="btnDisc" class="sec" data-i18n="btnDisconnect" disabled>Disconnetti</button>
      <span class="val" id="serialinfo">1200 7N1</span>
      <span id="rate" class="val"></span>
    </div>
    <details>
      <summary data-i18n="advanced">Impostazioni avanzate</summary>
      <div class="row">
        <label for="baud" data-i18n="lblBaud">Baud</label>
        <input id="baud" type="number" value="1200" style="width:90px">
        <label for="bits" data-i18n="lblBits">Bit di dati</label>
        <select id="bits"><option value="7" selected>7</option><option value="8">8</option></select>
        <label><input type="checkbox" id="swap8" checked> <span data-i18n="lblSwap8"></span></label>
      </div>
      <p class="muted" data-i18n-html="advNote"></p>
    </details>
  </div>

  <!-- ===== Gara ===== -->
  <div class="card">
    <p class="cardtitle"><span data-i18n="titleRace">Gara</span>
       <span id="leader" class="val" style="text-transform:none;letter-spacing:0"></span></p>
    <div id="notimes" class="note" style="display:none" data-i18n-html="noTimes"></div>
    <div class="tbwrap"><table>
      <thead><tr>
        <th class="n" data-i18n="colPos">Pos</th>
        <th data-i18n="colCar">Auto</th>
        <th class="n" data-i18n="colLaps">Giri</th>
        <th data-i18n="colFuel">Benzina</th>
        <th class="n" data-i18n="colLast">Ultimo giro</th>
        <th class="n" data-i18n="colBest">Migliore</th>
        <th data-i18n="colState">Stato</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table></div>
    <div class="row"><button id="btnReset" class="sec" data-i18n="btnReset">Azzera gara</button></div>
  </div>

  <!-- ===== Grezzo ===== -->
  <div class="card">
    <p class="cardtitle" data-i18n="titleRaw">Dati grezzi</p>
    <div class="row">
      <button id="btnClear" class="sec" data-i18n="btnClear">Pulisci</button>
      <button id="btnExport" class="sec" data-i18n="btnExport" disabled>⬇ Esporta</button>
      <span id="cnt" class="val"></span>
    </div>
    <div id="log"></div>
  </div>

  <!-- ===== Cablaggio ===== -->
  <div class="card">
    <p class="cardtitle" data-i18n="titleWiring">Cablaggio</p>
    <p class="muted" data-i18n-html="wiringIntro"></p>
    <p class="wire">
      Mini-DIN 6 &nbsp;pin&nbsp;<b>1</b> &nbsp;→&nbsp; DB-9 &nbsp;pin&nbsp;<b>2</b> &nbsp;<span class="muted" data-i18n="wA"></span><br>
      Mini-DIN 6 &nbsp;pin&nbsp;<b>6</b> &nbsp;→&nbsp; DB-9 &nbsp;pin&nbsp;<b>3</b> &nbsp;<span class="muted" data-i18n="wB"></span><br>
      Mini-DIN 6 &nbsp;pin&nbsp;<b>5</b> &nbsp;→&nbsp; DB-9 &nbsp;pin&nbsp;<b>5</b> &nbsp;<span class="muted" data-i18n="wC"></span>
    </p>
    <img src="NincoDB9.jpg" alt="Mini-DIN 6 → DB-9" style="max-width:100%;border-radius:8px;margin-top:6px">
    <p class="muted" data-i18n-html="wiringNote"></p>
  </div>

<script src="../i18n.js"></script>
<script src="ninco.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const T = (k) => (window.I18N ? I18N.t(k) : k);

let port = null, reader = null, keepReading = false;
let framer = new NINCO.Framer(), state = new NINCO.RaceState();
let lines = [], nPkt = 0, t0 = 0;

if (!navigator.serial) { $("noser").style.display = "block"; $("btnConn").disabled = true; }

function setStatus(){
  $("st").textContent = T(port ? "stConn" : "stDisc");
  $("st").className = "pill" + (port ? " on" : "");
  const m = $("mode");
  if (state.professional === null){ m.style.display = "none"; return; }
  m.style.display = "";
  m.textContent = T(state.professional ? "mPro" : "mAma") + (state.lights ? " · " + T("mLights") : "");
  m.className = "pill warn";
}

/* ---------- seriale ---------- */
async function connect(){
  try {
    port = await navigator.serial.requestPort();
    await port.open({
      baudRate: Number($("baud").value) || NINCO.SERIAL.baudRate,
      dataBits: Number($("bits").value) || NINCO.SERIAL.dataBits,
      stopBits: NINCO.SERIAL.stopBits,
      parity: NINCO.SERIAL.parity
    });
  } catch (e) {
    if (e && e.name === "NotFoundError") return;     // scelta annullata dall'utente
    alert(T("errOpen") + (e && e.message ? e.message : e));
    port = null; return;
  }
  keepReading = true; t0 = Date.now();
  $("btnConn").disabled = true; $("btnDisc").disabled = false;
  setStatus(); readLoop();
}

async function disconnect(){
  keepReading = false;
  try { reader && await reader.cancel(); } catch(e){}
  try { port && await port.close(); } catch(e){}
  port = null;
  $("btnConn").disabled = false; $("btnDisc").disabled = true;
  setStatus();
}

async function readLoop(){
  while (keepReading && port && port.readable){
    try {
      reader = port.readable.getReader();
      while (true){
        const { value, done } = await reader.read();
        if (done) break;
        if (value && value.length) onBytes(value);
      }
    } catch (e) { break; }
    finally { try { reader && reader.releaseLock(); } catch(e){} reader = null; }
  }
}

function onBytes(chunk){
  const opts = { swapCar8: $("swap8").checked };
  for (const line of framer.push(chunk)){
    const pkt = NINCO.parseLine(line, opts);
    if (!pkt) continue;
    nPkt++;
    state.apply(pkt);
    lines.push({ t: Date.now(), line, type: pkt.type });
    if (lines.length > 3000) lines.splice(0, lines.length - 3000);
  }
  render();
}

/* ---------- vista ---------- */
let pending = false;
function render(){
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; draw(); });
}

function fuelCell(c){
  if (c.reserve) return '<span class="res">' + T("sRes") + "</span>";
  if (c.fuel == null) return "—";
  const pct = Math.max(0, Math.min(100, c.fuel));
  return '<span class="fuel' + (pct <= 20 ? " low" : "") + '"><i style="width:' + pct + '%"></i></span>' + c.fuel;
}

function stateCell(c){
  if (!c.racing) return '<span class="muted">' + T("sOut") + "</span>";
  if (c.meaning === "stop") return T("sStop");
  if (c.meaning === "slow") return '<span style="color:var(--warn)">' + T("sSlow") + "</span>";
  return T("sFree");
}

function draw(){
  setStatus();

  // Un'auto in riserva ha fuel === null (il livello non viene trasmesso): senza
  // c.reserve nel filtro sparirebbe dalla tabella proprio quando c'è da guardarla.
  const cars = state.list().filter(c => c.racing || c.laps != null || c.fuel != null || c.reserve);
  $("tb").innerHTML = cars.map(c =>
    '<tr class="' + (c.racing ? "" : "out") + '">' +
      '<td class="n' + (c.position === 1 ? " lead" : "") + '">' + (c.position || "—") + "</td>" +
      "<td>#" + c.car + "</td>" +
      '<td class="n">' + (c.laps == null ? "—" : c.laps) + "</td>" +
      "<td>" + fuelCell(c) + "</td>" +
      '<td class="n">' + NINCO.formatMs(c.lastLapMs) + "</td>" +
      '<td class="n">' + NINCO.formatMs(c.bestMs) + "</td>" +
      "<td>" + stateCell(c) + "</td>" +
    "</tr>").join("") || "";

  $("leader").textContent = state.leaderLaps == null ? "" : T("leaderLaps") + " " + state.leaderLaps;
  // I tempi arrivano solo dal firmware 1.08 in su: se non e' mai arrivato un D, dillo.
  $("notimes").style.display = (nPkt > 0 && !state.sawResult) ? "" : "none";

  const last = lines.slice(-40);
  $("log").textContent = last.map(l =>
    new Date(l.t).toISOString().substr(11, 12) + "  " + l.line).join("\n");
  $("log").scrollTop = $("log").scrollHeight;
  $("cnt").textContent = nPkt ? nPkt + " " + T("pkts") : "";
  $("btnExport").disabled = lines.length === 0;
}

/* ---------- comandi ---------- */
$("btnConn").onclick = connect;
$("btnDisc").onclick = disconnect;
$("btnReset").onclick = () => { state = new NINCO.RaceState(); draw(); };
$("btnClear").onclick = () => { lines = []; nPkt = 0; draw(); };
$("btnExport").onclick = () => {
  const head = "# Ninco N-Digital — cattura\n# " + new Date().toISOString() +
               "  pacchetti=" + nPkt + "\n";
  const body = lines.map(l => new Date(l.t).toISOString() + "  " + l.type.padEnd(8) + "  " + l.line).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([head + body], { type: "text/plain" }));
  a.download = "ninco-" + new Date().toISOString().replace(/[:.]/g, "-") + ".txt";
  a.click(); URL.revokeObjectURL(a.href);
};

// i18n.js costruisce il dizionario su DOMContentLoaded: se disegnassi solo adesso
// si vedrebbero le chiavi grezze al posto del testo.
document.addEventListener("i18n:changed", draw);
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", draw);
else draw();
</script>
<script src="../tema.js"></script>
</body>
</html>
