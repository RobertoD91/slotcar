<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Slot Car Web Tools</title>
<style>
  :root{--bg:#0f1115;--fg:#e9edf3;--mut:#8a94a6;--acc:#5db0ff;--ok:#4ec36b;--err:#ff5c5c;--card:#171a21;--bd:#2a2f3a;--accfg:#04121f}
  @media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--fg:#1a1d23;--mut:#5b6472;--card:#fff;--bd:#dfe3ea}}
  :root[data-theme="dark"]{--bg:#0f1115;--fg:#e9edf3;--mut:#8a94a6;--card:#171a21;--bd:#2a2f3a}
  :root[data-theme="light"]{--bg:#f6f7f9;--fg:#1a1d23;--mut:#5b6472;--card:#fff;--bd:#dfe3ea}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);padding:20px 16px;max-width:820px;margin:0 auto}
  h1{font-size:24px;margin:0 0 2px}.sub{color:var(--mut);margin:0 0 20px;font-size:14px}
  h2{font-size:15px;margin:26px 0 10px;color:var(--mut);font-weight:600;letter-spacing:.02em}
  h2 small{font-weight:400}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  a.card,div.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
  a.card{transition:transform .08s,border-color .12s}
  a.card:hover{transform:translateY(-2px);border-color:var(--acc)}
  .card.soon{opacity:.6}
  .card .ico{font-size:30px}
  .card h3{margin:8px 0 4px;font-size:17px}
  .card p{margin:0;color:var(--mut);font-size:13px}
  .badge{float:right;font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--bd);color:var(--mut)}
  .badge.on{color:var(--ok);border-color:var(--ok)}
  .tech{margin-top:8px;font-size:11px;color:var(--mut)}
  .tech span{display:inline-block;border:1px solid var(--bd);border-radius:6px;padding:1px 7px;margin:2px 4px 0 0}
  footer{color:var(--mut);font-size:12px;margin-top:24px;border-top:1px solid var(--bd);padding-top:12px}
  #upd{display:none;background:var(--acc);color:var(--accfg);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-weight:600}
  #upd button{background:var(--accfg);color:var(--acc);border:0;border-radius:7px;padding:6px 12px;font-weight:700;cursor:pointer;margin-left:8px}
  .compat{display:none;background:var(--err);color:#180404;border-radius:10px;padding:12px 14px;margin-bottom:10px;font-weight:600}
</style>
</head>
<body>
  <div id="nobt" class="compat" data-i18n-html="noBt"></div>
  <div id="noser" class="compat" data-i18n-html="noSerial"></div>
  <div id="upd"><span data-i18n="updateAvail"></span> <button onclick="reloadFresh()" data-i18n="updateBtn"></button></div>
  <h1>Slot Car Web Tools</h1>
  <p class="sub" data-i18n-html="sub"></p>

  <h2 data-i18n-html="secOxigen"></h2>
  <div class="grid">
    <a class="card" href="car-config/">
      <span class="badge on" data-i18n="badgeActive"></span>
      <div class="ico">🚗</div>
      <h3 data-i18n="carTitle"></h3>
      <p data-i18n="carDesc"></p>
      <div class="tech"><span>Web Bluetooth</span></div>
    </a>
    <a class="card" href="remote-config/">
      <span class="badge on" data-i18n="badgeActive"></span>
      <div class="ico">🎮</div>
      <h3 data-i18n="ctrlTitle"></h3>
      <p data-i18n="ctrlDesc"></p>
      <div class="tech"><span>Web Bluetooth</span></div>
    </a>
    <a class="card" href="dongle-debug/">
      <span class="badge on" data-i18n="badgeActive"></span>
      <div class="ico">🔧</div>
      <h3 data-i18n="dongleTitle"></h3>
      <p data-i18n-html="dongleDesc"></p>
      <div class="tech"><span>Web Serial</span></div>
    </a>
    <a class="card" href="modes/">
      <span class="badge on" data-i18n="badgeActive"></span>
      <div class="ico">🎛️</div>
      <h3 data-i18n="modesTitle"></h3>
      <p data-i18n="modesDesc"></p>
      <div class="tech"><span data-i18n="techStatic"></span></div>
    </a>
    <div class="card soon">
      <span class="badge" data-i18n="badgeSoon"></span>
      <div class="ico">🏁</div>
      <h3 data-i18n="lapsTitle"></h3>
      <p data-i18n-html="lapsDesc"></p>
      <div class="tech"><span>Web Serial</span></div>
    </div>
    <div class="card soon">
      <span class="badge" data-i18n="badgeSoon"></span>
      <div class="ico">🔄</div>
      <h3 data-i18n="bootTitle"></h3>
      <p data-i18n="bootDesc"></p>
      <div class="tech"><span>Web Serial</span></div>
    </div>
  </div>

  <h2 data-i18n-html="secDs"></h2>
  <div class="grid">
    <a class="card" href="ds200/">
      <span class="badge on" data-i18n="badgeActive"></span>
      <div class="ico">⏱️</div>
      <h3 data-i18n="dsTitle"></h3>
      <p data-i18n-html="dsDesc"></p>
      <div class="tech"><span>Web Serial</span><span data-i18n="techPwa"></span></div>
    </a>
    <a class="card" href="ds200/flash.html">
      <span class="badge on" data-i18n="badgeActive"></span>
      <div class="ico">⚡</div>
      <h3 data-i18n="dsFlashTitle"></h3>
      <p data-i18n-html="dsFlashDesc"></p>
      <div class="tech"><span>Web Serial</span><span>ESP32</span></div>
    </a>
  </div>

  <footer>
    <span id="ver">…</span>
  </footer>

<script>

<script src="i18n.js"></script>
<script>
const SITE_VERSION="1.0.0";
function reloadFresh(){location.href=location.pathname+"?v="+Date.now();}
// Banner di compatibilità: le app BLE e quelle seriali hanno requisiti diversi.
if(!navigator.bluetooth)document.getElementById("nobt").style.display="block";
if(!navigator.serial)document.getElementById("noser").style.display="block";
// service worker network-first: sempre l'ultima versione (fix cache)
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
// versione sito + prompt aggiornamento
function renderVer(j){
  const T=(window.I18N?I18N.t:(k=>k));
  document.getElementById("ver").textContent=T("footSite")+(j.site||"?")+" · "+T("footUpd")+" "+(j.updated||"");
}
let _verData=null;
fetch("version.json?_="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(j=>{
  _verData=j; renderVer(j);
  if(j.site&&j.site!==SITE_VERSION)document.getElementById("upd").style.display="block";
}).catch(()=>{document.getElementById("ver").textContent="";});
// ri-render del footer dinamico al cambio lingua
document.addEventListener("i18n:changed",()=>{ if(_verData)renderVer(_verData); });
</script>
</body>
</html>
