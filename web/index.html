<title>Slot Car Web Tools</title>
<style>
  :root{--bg:#0f1115;--fg:#e9edf3;--mut:#8a94a6;--acc:#5db0ff;--ok:#4ec36b;--err:#ff5c5c;--card:#171a21;--bd:#2a2f3a;--accfg:#04121f}
  @media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--fg:#1a1d23;--mut:#5b6472;--card:#fff;--bd:#dfe3ea}}
  :root[data-theme="dark"]{--bg:#0f1115;--fg:#e9edf3;--mut:#8a94a6;--card:#171a21;--bd:#2a2f3a}
  :root[data-theme="light"]{--bg:#f6f7f9;--fg:#1a1d23;--mut:#5b6472;--card:#fff;--bd:#dfe3ea}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);padding:20px 16px;max-width:820px;margin:0 auto}
  h1{font-size:24px;margin:0 0 2px}.sub{color:var(--mut);margin:0 0 20px;font-size:14px}
  /* Titoli di sezione: grandi e con una riga sopra, così si vede a colpo d'occhio
     dove finisce un sistema e ne comincia un altro. */
  h2{font-size:27px;font-weight:800;letter-spacing:-.02em;color:var(--fg);
     margin:44px 0 14px;padding-top:22px;border-top:2px solid var(--bd)}
  h2 small{display:block;font-size:13px;font-weight:400;letter-spacing:0;
           color:var(--mut);margin-top:5px}
  /* La card in evidenza: è l'app che conta, il resto sono strumenti di servizio. */
  .hero{display:block;text-decoration:none;color:inherit;
        border:2px solid var(--acc);border-radius:16px;padding:20px 22px;margin-bottom:14px;
        background:linear-gradient(140deg,rgba(93,176,255,.10),rgba(93,176,255,.02));
        transition:transform .08s,box-shadow .12s}
  a.hero:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(93,176,255,.18)}
  .hero .ico{font-size:38px;line-height:1}
  .hero h3{margin:10px 0 6px;font-size:22px;font-weight:800;letter-spacing:-.01em}
  .hero p{margin:0;color:var(--mut);font-size:14px;line-height:1.6}
  .hero .badge{border-color:var(--acc);color:var(--acc)}
  .rest{color:var(--mut);font-size:13px;margin:18px 0 0}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  a.card,div.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
  a.card{transition:transform .08s,border-color .12s}
  a.card:hover{transform:translateY(-2px);border-color:var(--acc)}
  .card.soon{opacity:.6}
  .card .ico{font-size:30px}
  .card h3{margin:8px 0 4px;font-size:17px}
  .card p{margin:0;color:var(--mut);font-size:13px}
  .badge{float:right;font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--bd);color:var(--mut)}
  .badge.on{color:var(--ok);border-color:var(--ok)}
  .badge.bad{color:var(--err);border-color:var(--err)}
  .badge.part{color:var(--acc);border-color:var(--acc)}
  .tech{margin-top:8px;font-size:11px;color:var(--mut)}
  .tech span{display:inline-block;border:1px solid var(--bd);border-radius:6px;padding:1px 7px;margin:2px 4px 0 0}
  footer{color:var(--mut);font-size:12px;margin-top:24px;border-top:1px solid var(--bd);padding-top:12px}
  #upd{display:none;background:var(--acc);color:var(--accfg);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-weight:600}
  #upd button{background:var(--accfg);color:var(--acc);border:0;border-radius:7px;padding:6px 12px;font-weight:700;cursor:pointer;margin-left:8px}
  .compat{display:none;background:var(--err);color:#180404;border-radius:10px;padding:12px 14px;margin-bottom:10px;font-weight:600}
  /* Avviso: roba da smanettoni, non da utente finale. */
  #dev{background:rgba(224,168,0,.12);border:1px solid #e0a800;border-radius:10px;
       padding:12px 14px;margin-bottom:16px;font-size:13.5px;line-height:1.55}
  #dev b{color:#e0a800}
  /* Nastro "Fork me on GitHub" nell'angolo in alto a destra. */
  .ghribbon{position:fixed;top:0;right:0;width:145px;height:145px;overflow:hidden;
            z-index:9997;pointer-events:none}
  .ghribbon a{pointer-events:auto;position:absolute;display:block;width:200px;padding:7px 0;
              background:#24292f;color:#fff;text-align:center;text-decoration:none;
              font:600 12px/1.35 -apple-system,Segoe UI,Roboto,sans-serif;
              transform:rotate(45deg);right:-53px;top:32px;
              box-shadow:0 2px 8px rgba(0,0,0,.35);
              border-top:1px solid rgba(255,255,255,.25);
              border-bottom:1px solid rgba(255,255,255,.25)}
  .ghribbon a:hover{background:#3a4149}
  /* Su schermo stretto il nastro mangia mezza pagina: via. */
  @media (max-width:640px){.ghribbon{display:none}}
</style>

<script>
const SITE_VERSION="2.5.0";
function reloadFresh(){location.href=location.pathname+"?v="+Date.now();}
// i18n.js piazza il selettore lingua in alto a DESTRA, dove qui c'è il nastro
// "Fork me on GitHub": su schermo largo lo sposto a sinistra, su schermo stretto
// il nastro sparisce e il selettore torna al suo posto.
function placeLang(){
  const s=document.getElementById("__langsel");
  if(!s||!s.parentElement)return;
  const wide=window.innerWidth>640;
  s.parentElement.style.left = wide?"8px":"auto";
  s.parentElement.style.right= wide?"auto":"8px";
}
addEventListener("resize",placeLang);
addEventListener("load",placeLang);
setTimeout(placeLang,0);
// Web Bluetooth e Web Serial esistono SOLO in contesto sicuro (https, o localhost).
// Su http il browser non le espone affatto, e i banner direbbero "browser non
// supportato": falso, e manda fuori strada. Quindi prima proviamo a passare a https,
// e se restiamo in chiaro lo diciamo esplicitamente invece di incolpare il browser.
(function(){
  const h=location.hostname;
  const dev = h==="localhost"||h==="127.0.0.1"||h==="[::1]"||h.endsWith(".local")
           || /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h);
  if(location.protocol==="http:" && !dev){
    location.replace("https://"+location.host+location.pathname+location.search+location.hash);
    return;
  }
  if(!window.isSecureContext && !dev){
    document.getElementById("nossl").style.display="block";
    return;
  }
  if(!navigator.bluetooth)document.getElementById("nobt").style.display="block";
  if(!navigator.serial)document.getElementById("noser").style.display="block";
})();
// service worker network-first: sempre l'ultima versione (fix cache)
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
// versione sito + prompt aggiornamento
function renderVer(j){
  const T=(window.I18N?I18N.t:(k=>k));
  document.getElementById("ver").textContent=T("footSite")+(j.site||"?")+" · "+T("footUpd")+" "+(j.updated||"");
}
let _verData=null;
fetch("version.json?_="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(j=>{
  _verData=j; renderVer(j);
  if(j.site&&j.site!==SITE_VERSION)document.getElementById("upd").style.display="block";
}).catch(()=>{document.getElementById("ver").textContent="";});
// ri-render del footer dinamico al cambio lingua
document.addEventListener("i18n:changed",()=>{ if(_verData)renderVer(_verData); });
</script>
</body>
