<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title data-i18n="ctrlHeading">Configuratore controller BLE — Slot Car Web Tools</title>
<link rel="stylesheet" href="../ui.css">
<style>
  /* Qui dentro solo quello che è di QUESTA pagina: la cornice sta in ../ui.css. */
  :root{--wrap:820px}
  label{min-width:130px}
  .warnbox{color:var(--err)}
  /* Le caselle "chiave: valore" dei registri letti. */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
  .fld{border:1px solid var(--bd);border-radius:9px;padding:8px 10px}
  .fld .k{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
  .fld .v{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;margin-top:2px}
</style>
</head>
<body class="app">
  <div id="nobt" class="banner nope" hidden data-i18n-html="noBt"></div>
  <div id="upd" class="banner upd" hidden><span data-i18n="updateAvail"></span> <button onclick="reloadFresh()" data-i18n="updateBtn"></button></div>
  <a class="back" href="../">← Slot Car Web Tools</a>
  <div class="note" data-i18n-html="oxigenPartial"></div>
  <h1><span data-i18n="ctrlHeading"></span> <span id="st" class="pill"></span></h1>
  <p class="sub" data-i18n-html="sub"></p>

  <div class="card">
    <div class="row">
      <button id="btnConn" data-i18n="btnConn"></button>
      <button id="btnDisc" class="sec" disabled data-i18n="btnDisc"></button>
      <span id="devname" class="val"></span>
    </div>
    <!-- si accende se il dispositivo scelto è il modulo Power Amplifier (nome SCP3A-…) -->
    <p class="note" id="paNote" hidden data-i18n-html="paNote"></p>
  </div>

  <!-- ===== Informazioni (sola lettura) ===== -->
  <div class="card">
    <p class="cardtitle" data-i18n="cardInfo"></p>
    <div class="row"><button id="btnReadAll" class="sec" disabled data-i18n="btnReadAll"></button>
      <span class="hint" data-i18n="readAllHint"></span></div>
    <div class="grid" style="margin-top:8px">
      <div class="fld"><div class="k" data-i18n="fldFw"></div><div class="v" id="fFw">—</div></div>
      <div class="fld"><div class="k" data-i18n="fldType"></div><div class="v" id="fType">—</div></div>
      <div class="fld"><div class="k" data-i18n="fldVer"></div><div class="v" id="fVer">—</div></div>
      <div class="fld"><div class="k">ID</div><div class="v" id="fId">—</div></div>
      <div class="fld"><div class="k">O2 MAC</div><div class="v" id="fMac">—</div></div>
      <div class="fld"><div class="k" data-i18n="fldDate"></div><div class="v" id="fDate">—</div></div>
    </div>
  </div>

  <!-- ===== Configurazione (Nome + Brake) ===== -->
  <div class="card">
    <p class="cardtitle" data-i18n="cardConfig"></p>
    <div class="hint" data-i18n-html="rebootHint"></div>
    <!-- Niente maxlength sul nome: il limite lo fa il filtro (prima ripulisce, poi
         taglia), altrimenti il browser tronca prima che il JS tolga i caratteri
         non ASCII e il conto dei 14 non torna. -->
    <div class="row"><label data-i18n="lblName"></label><input id="cName" size="16" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:phName" placeholder=""></div>
    <div class="hint" data-i18n-html="nameHint"></div>
    <!-- Solo i modi 0 e 1: il 2 (Sweep) non si rilegge e si perde al riavvio. -->
    <div class="row"><label data-i18n="lblBrake"></label>
      <select id="cBrake">
        <option value="" data-i18n="brakeNone"></option>
        <option value="0" data-i18n="brakeDefault"></option>
        <option value="1" data-i18n="brakeLinear"></option>
      </select></div>
    <div class="row"><button class="cfg" data-fn="write" disabled data-i18n="btnWrite"></button>
      <span class="hint" data-i18n-html="writeHint"></span></div>
  </div>

  <!-- ===== ID (schermata a parte) ===== -->
  <div class="card">
    <p class="cardtitle" data-i18n="cardId"></p>
    <div class="row"><label>ID (1–20)</label><input id="cId" type="number" min="1" max="20" style="width:80px">
      <button class="sec cfg" data-fn="id" disabled data-i18n="btnSetId"></button></div>
  </div>

  <!-- ===== Identità radio O2 (registro 0x90) ===== -->
  <div class="card">
    <p class="cardtitle" data-i18n="cardClone"></p>
    <div class="row"><label data-i18n="lblMac"></label><input id="cMac" size="6" inputmode="latin" autocomplete="off" spellcheck="false" placeholder="1A2B" aria-describedby="macHint">
      <button class="warn cfg" data-fn="clone" disabled data-i18n="btnClone"></button>
      <button class="sec cfg" data-fn="rstmac" disabled data-i18n="btnRstMac"></button></div>
    <div id="macHint" class="warnbox" data-i18n-html="cloneWarn"></div>
    <div class="hint" data-i18n-html="e7Hint"></div>
  </div>

  <!-- ===== Avanzato ===== -->
  <div class="card">
    <details><summary style="cursor:pointer;color:var(--mut)" data-i18n="advSummary"></summary>
      <div class="hint" style="margin-top:8px" data-i18n-html="rawHint"></div>
      <div class="hint" style="margin-top:8px" data-i18n-html="curveHint"></div>
      <div class="row" style="margin-top:8px"><label data-i18n="lblRawRead"></label><input id="rReg" size="6" placeholder="0x8f">
        <button class="sec cfg" data-fn="rawread" disabled data-i18n="btnRawRead"></button></div>
      <div class="row"><label data-i18n="lblRawWrite"></label><input id="wReg" size="6" placeholder="0x8c"><input id="wVal" size="14" data-i18n-attr="placeholder:phRawWrite" placeholder="">
        <button class="sec cfg" data-fn="rawwrite" disabled data-i18n="btnRawWrite"></button></div>
      <div id="rawMsg" class="warnbox" aria-live="polite"></div>
      <div class="tbwrap"><table id="regtab" style="margin-top:8px"><thead><tr><th data-i18n="thReg"></th><th data-i18n="thName"></th><th data-i18n="thValue"></th><th></th></tr></thead><tbody></tbody></table></div>
    </details>
  </div>

  <div class="card"><details><summary style="cursor:pointer;color:var(--mut)" data-i18n="advLog"></summary><div id="log"></div></details></div>

<!-- Il piè di tutte le pagine (ui.css): i18n.js ci mette il disclaimer, in fondo la versione. -->
<footer><p class="ver">v<span id="appver"></span></p></footer>

window.I18N_STRINGS = {
  sub:{
    it:"Legge/scrive i registri del controller SCP-3 via BLE (NUS a registri). Chrome/Edge desktop o Chrome Android. <b>Solo su hardware tuo.</b>",
    en:"Reads/writes the SCP-3 controller registers over BLE (register-based NUS). Chrome/Edge desktop or Chrome Android. <b>Only on your own hardware.</b>",

  btnConn:{it:"🔵 Connetti",en:"🔵 Connect",es:"🔵 Conectar",fr:"🔵 Connecter",de:"🔵 Verbinden"},

  fldFw:{it:"Firmware",en:"Firmware",es:"Firmware",fr:"Firmware",de:"Firmware"},

  cardConfig:{it:"Configurazione",en:"Configuration",es:"Configuración",fr:"Configuration",de:"Konfiguration"},
  rebootHint:{
    it:"Ogni scrittura viene salvata, ma il controller la <b>applica dal prossimo riavvio</b>. Il «DO» arriva <b>prima</b> che il controller salvi in memoria: dopo una scrittura aspetta un paio di secondi prima di spegnerlo.",
    en:"Every write is saved, but the controller <b>applies it from the next restart</b>. The \"DO\" arrives <b>before</b> the controller saves to memory: after a write, wait a couple of seconds before switching it off.",
    es:"Cada escritura se guarda, pero el mando la <b>aplica desde el próximo reinicio</b>. El «DO» llega <b>antes</b> de que el mando guarde en memoria: después de una escritura espera un par de segundos antes de apagarlo.",
    fr:"Chaque écriture est enregistrée, mais la manette ne l'<b>applique qu'au prochain redémarrage</b>. Le « DO » arrive <b>avant</b> que la manette n'enregistre en mémoire : après une écriture, attends quelques secondes avant de l'éteindre.",
    de:"Jeder Schreibvorgang wird gespeichert, aber der Handregler <b>übernimmt ihn erst beim nächsten Neustart</b>. Das „DO“ kommt, <b>bevor</b> der Handregler in den Speicher schreibt: Warte nach einem Schreibvorgang ein paar Sekunden, bevor du ihn ausschaltest."
  },
  lblName:{it:"Nome dispositivo",en:"Device name",es:"Nombre del dispositivo",fr:"Nom de l'appareil",de:"Gerätename"},
  phName:{it:"es. Il mio controller",en:"e.g. My controller",es:"p. ej. Mi mando",fr:"ex. Ma manette",de:"z. B. Mein Handregler"},
  nameHint:{
    it:"Registro <code>0x83</code>: <b>14 caratteri ASCII</b> esatti, il resto si completa con spazi; le lettere accentate perdono l'accento e gli altri simboli non ASCII si scartano. ⚠️ Il controller trasforma in <b>«.»</b> gli spazi in 1ª, 3ª, 5ª… posizione, compresi quelli di riempimento: «Roberto Scp3 A» diventa «Roberto Scp3.A» e un nome corto finisce con «. . .». In rilettura il nome può quindi essere diverso da quello scritto; per evitarlo usa tutti e 14 i caratteri, senza spazi in quelle posizioni.",
    en:"Register <code>0x83</code>: exactly <b>14 ASCII characters</b>, padded with spaces; accented letters lose the accent and other non-ASCII symbols are dropped. ⚠️ The controller turns the spaces in the 1st, 3rd, 5th… position into <b>\".\"</b>, padding included: \"Roberto Scp3 A\" becomes \"Roberto Scp3.A\" and a short name ends with \". . .\". When read back the name may therefore differ from what you wrote; to avoid it, use all 14 characters with no spaces in those positions.",
    es:"Registro <code>0x83</code>: exactamente <b>14 caracteres ASCII</b>, completados con espacios; las letras acentuadas pierden el acento y los demás símbolos no ASCII se descartan. ⚠️ El mando convierte en <b>«.»</b> los espacios en 1.ª, 3.ª, 5.ª… posición, incluidos los de relleno: «Roberto Scp3 A» se convierte en «Roberto Scp3.A» y un nombre corto termina en «. . .». Al releerlo el nombre puede ser distinto del escrito; para evitarlo usa los 14 caracteres, sin espacios en esas posiciones.",
    fr:"Registre <code>0x83</code> : exactement <b>14 caractères ASCII</b>, complétés par des espaces ; les lettres accentuées perdent leur accent et les autres symboles non ASCII sont ignorés. ⚠️ La manette transforme en <b>« . »</b> les espaces en 1re, 3e, 5e… position, y compris ceux de remplissage : « Roberto Scp3 A » devient « Roberto Scp3.A » et un nom court se termine par « . . . ». À la relecture, le nom peut donc différer de celui que tu as écrit ; pour l'éviter, utilise les 14 caractères, sans espace à ces positions.",
    de:"Register <code>0x83</code>: genau <b>14 ASCII-Zeichen</b>, der Rest wird mit Leerzeichen aufgefüllt; Buchstaben mit Akzent oder Umlaut verlieren ihn, andere Nicht-ASCII-Zeichen werden verworfen. ⚠️ Der Handregler macht aus den Leerzeichen an 1., 3., 5. … Stelle einen <b>„.“</b>, auch aus den Füllzeichen: „Roberto Scp3 A“ wird zu „Roberto Scp3.A“, und ein kurzer Name endet mit „. . .“. Beim Zurücklesen kann der Name daher vom geschriebenen abweichen; um das zu vermeiden, nutze alle 14 Zeichen ohne Leerzeichen an diesen Stellen."
  },
  lblBrake:{it:"Impostazione freno",en:"Brake setting",es:"Ajuste de freno",fr:"Réglage du frein",de:"Bremseinstellung"},
  brakeNone:{it:"— (leggi configurazione)",en:"— (read configuration)",es:"— (leer configuración)",fr:"— (lire la configuration)",de:"— (Konfiguration lesen)"},
  brakeDefault:{it:"Default",en:"Default",es:"Predeterminado",fr:"Par défaut",de:"Standard"},
  brakeLinear:{it:"Manopola (trimmer)",en:"Knob (trimmer)",es:"Potenciómetro (trimmer)",fr:"Molette (trimmer)",de:"Drehknopf (Trimmer)"},
  btnWrite:{it:"Scrivi (Nome + Freno)",en:"Write (Name + Brake)",es:"Escribir (Nombre + Freno)",fr:"Écrire (Nom + Frein)",de:"Schreiben (Name + Bremse)"},
  writeHint:{
    it:"come il tasto <b>Scrivi</b> dell'app: scrive Nome (0x83, se non è vuoto) e Impostazione freno (0x8c). Il modo freno 2 (Sweep) non è offerto: non si rilegge e si perde al riavvio",
    en:"like the app's <b>Write</b> button: writes Name (0x83, if not empty) and Brake setting (0x8c). Brake mode 2 (Sweep) is not offered: it does not read back and is lost on restart",
    es:"como el botón <b>Escribir</b> de la app: escribe Nombre (0x83, si no está vacío) y Ajuste de freno (0x8c). El modo de freno 2 (Sweep) no se ofrece: no se relee y se pierde al reiniciar",
    fr:"comme le bouton <b>Écrire</b> de l'app : écrit le Nom (0x83, s'il n'est pas vide) et le Réglage du frein (0x8c). Le mode de frein 2 (Sweep) n'est pas proposé : il ne se relit pas et se perd au redémarrage",
    de:"wie die Taste <b>Schreiben</b> der App: schreibt Name (0x83, wenn nicht leer) und Bremseinstellung (0x8c). Bremsmodus 2 (Sweep) wird nicht angeboten: Er lässt sich nicht zurücklesen und geht beim Neustart verloren"
  },
  cardId:{it:"ID controller",en:"Controller ID",es:"ID del mando",fr:"ID de la manette",de:"Handregler-ID"},
  btnSetId:{it:"Imposta ID",en:"Set ID",es:"Establecer ID",fr:"Définir l'ID",de:"ID setzen"},
  cardClone:{it:"Identità radio O2 (registro 0x90)",en:"O2 radio identity (register 0x90)",es:"Identidad de radio O2 (registro 0x90)",fr:"Identité radio O2 (registre 0x90)",de:"O2-Funkidentität (Register 0x90)"},
  lblMac:{it:"O2 MAC (2 byte)",en:"O2 MAC (2 bytes)",es:"O2 MAC (2 bytes)",fr:"MAC O2 (2 octets)",de:"O2-MAC (2 Bytes)"},
  btnClone:{it:"Scrivi MAC O2",en:"Write O2 MAC",es:"Escribir MAC O2",fr:"Écrire le MAC O2",de:"O2-MAC schreiben"},

  confirmRstMac:{
    it:"Ripristinare l'identità radio O2 di fabbrica (registro 0x9F)? Il controller torna ai 2 byte ricavati dal MAC del proprio chip. Ha effetto dal prossimo riavvio.",
    en:"Restore the factory O2 radio identity (register 0x9F)? The controller goes back to the 2 bytes derived from its own chip MAC. Takes effect from the next restart.",
    es:"¿Restaurar la identidad de radio O2 de fábrica (registro 0x9F)? El mando vuelve a los 2 bytes derivados del MAC de su propio chip. Tiene efecto desde el próximo reinicio.",
    fr:"Rétablir l'identité radio O2 d'usine (registre 0x9F) ? La manette revient aux 2 octets tirés du MAC de sa propre puce. Prend effet au prochain redémarrage.",
    de:"O2-Funkidentität ab Werk wiederherstellen (Register 0x9F)? Der Handregler kehrt zu den 2 Bytes zurück, die aus der MAC seines eigenen Chips abgeleitet sind. Wirkt ab dem nächsten Neustart."
  },
  cloneWarn:{
    it:"⚠️ Il registro <code>0x90</code> contiene i <b>2 byte dell'identità radio O2</b> del controller (prima il byte alto, poi il basso): da questi si ricava l'indirizzo con cui parla alle auto, e le auto abbinate rispondono a quei 2 byte. <b>Due controller con gli stessi 2 byte comandano le stesse auto.</b> C'è una conferma, e si scrive <b>solo</b> <code>0x90</code>. <b>Ripristina di fabbrica</b> scrive <code>0x9F</code>, che rimette i 2 byte ricavati dal MAC del chip: per questo non va mai mandato subito dopo una scrittura di <code>0x90</code>, la annullerebbe. (<code>0x80</code>, l'aggiornamento firmware, non è esposto qui apposta.)",
    en:"⚠️ Register <code>0x90</code> holds the <b>2 bytes of the controller's O2 radio identity</b> (high byte first, then low): the address it uses to talk to the cars is derived from them, and the bound cars answer to those 2 bytes. <b>Two controllers with the same 2 bytes control the same cars.</b> There is a confirmation, and <b>only</b> <code>0x90</code> is written. <b>Restore factory value</b> writes <code>0x9F</code>, which puts back the 2 bytes derived from the chip MAC: that is why it must never be sent right after a write of <code>0x90</code>, it would undo it. (<code>0x80</code>, the firmware update, is deliberately not exposed here.)",
    es:"⚠️ El registro <code>0x90</code> contiene los <b>2 bytes de la identidad de radio O2</b> del mando (primero el byte alto, luego el bajo): de ellos se obtiene la dirección con la que habla a los coches, y los coches vinculados responden a esos 2 bytes. <b>Dos mandos con los mismos 2 bytes controlan los mismos coches.</b> Hay una confirmación, y se escribe <b>solo</b> <code>0x90</code>. <b>Restaurar de fábrica</b> escribe <code>0x9F</code>, que devuelve los 2 bytes derivados del MAC del chip: por eso nunca debe enviarse justo después de una escritura de <code>0x90</code>, la anularía. (<code>0x80</code>, la actualización de firmware, no se expone aquí a propósito.)",
    fr:"⚠️ Le registre <code>0x90</code> contient les <b>2 octets de l'identité radio O2</b> de la manette (d'abord l'octet haut, puis le bas) : c'est d'eux que l'on tire l'adresse avec laquelle elle parle aux voitures, et les voitures appairées répondent à ces 2 octets. <b>Deux manettes avec les mêmes 2 octets commandent les mêmes voitures.</b> Il y a une confirmation, et on écrit <b>seulement</b> <code>0x90</code>. <b>Rétablir la valeur d'usine</b> écrit <code>0x9F</code>, qui remet les 2 octets tirés du MAC de la puce : c'est pourquoi il ne faut jamais l'envoyer juste après une écriture de <code>0x90</code>, il l'annulerait. (<code>0x80</code>, la mise à jour du firmware, n'est volontairement pas proposé ici.)",
    de:"⚠️ Register <code>0x90</code> enthält die <b>2 Bytes der O2-Funkidentität</b> des Handreglers (zuerst das hohe Byte, dann das niedrige): Daraus ergibt sich die Adresse, mit der er zu den Autos spricht, und die gekoppelten Autos antworten auf diese 2 Bytes. <b>Zwei Handregler mit denselben 2 Bytes steuern dieselben Autos.</b> Es gibt eine Bestätigung, und geschrieben wird <b>nur</b> <code>0x90</code>. <b>Werkseinstellung wiederherstellen</b> schreibt <code>0x9F</code>, das die aus der MAC des Chips abgeleiteten 2 Bytes zurückholt: Deshalb darf es nie direkt nach einem Schreiben von <code>0x90</code> gesendet werden, es würde den Schreibvorgang aufheben. (<code>0x80</code>, das Firmware-Update, wird hier absichtlich nicht angeboten.)"
  },
  advSummary:{it:"Avanzato — registri grezzi",en:"Advanced — raw registers",es:"Avanzado — registros en bruto",fr:"Avancé — registres bruts",de:"Erweitert — Rohregister"},
  rawHint:{
    it:"La console accetta solo i registri della tabella, con il numero di byte giusto per ciascuno. Il motivo: a un registro che non gestisce il controller risponde <b>«DO»</b> lo stesso, senza aver scritto niente — e dopo una lettura o scrittura del freno (<code>0x8B</code>/<code>0x8C</code>) quella scrittura finisce nel valore del freno. Valori in esadecimale (<code>32</code>, <code>1a 2b</code>); per <code>0x83</code> si scrive il nome in chiaro. Bloccati apposta anche <code>0x80</code> (aggiornamento firmware), i registri di attivazione <code>0x81</code>/<code>0x82</code> e il modo freno 2.",
    en:"The console only accepts the registers in the table, with the right number of bytes for each one. The reason: the controller answers <b>\"DO\"</b> even to a register it does not handle, without writing anything — and after a brake read or write (<code>0x8B</code>/<code>0x8C</code>) that write ends up in the brake value. Values in hex (<code>32</code>, <code>1a 2b</code>); for <code>0x83</code> type the name as plain text. Also blocked on purpose: <code>0x80</code> (firmware update), the activation registers <code>0x81</code>/<code>0x82</code> and brake mode 2.",
    es:"La consola solo acepta los registros de la tabla, con el número de bytes correcto para cada uno. El motivo: a un registro que no gestiona el mando responde <b>«DO»</b> igualmente, sin haber escrito nada — y después de una lectura o escritura del freno (<code>0x8B</code>/<code>0x8C</code>) esa escritura acaba en el valor del freno. Valores en hexadecimal (<code>32</code>, <code>1a 2b</code>); para <code>0x83</code> se escribe el nombre en claro. Bloqueados a propósito también <code>0x80</code> (actualización de firmware), los registros de activación <code>0x81</code>/<code>0x82</code> y el modo de freno 2.",
    fr:"La console n'accepte que les registres du tableau, avec le bon nombre d'octets pour chacun. La raison : à un registre qu'elle ne gère pas, la manette répond quand même <b>« DO »</b>, sans rien avoir écrit — et après une lecture ou une écriture du frein (<code>0x8B</code>/<code>0x8C</code>), cette écriture finit dans la valeur du frein. Valeurs en hexadécimal (<code>32</code>, <code>1a 2b</code>) ; pour <code>0x83</code>, on écrit le nom en clair. Bloqués exprès aussi : <code>0x80</code> (mise à jour du firmware), les registres d'activation <code>0x81</code>/<code>0x82</code> et le mode de frein 2.",
    de:"Die Konsole nimmt nur die Register aus der Tabelle an, jeweils mit der richtigen Anzahl Bytes. Der Grund: Auf ein Register, das er nicht verarbeitet, antwortet der Handregler trotzdem <b>„DO“</b>, ohne etwas geschrieben zu haben — und nach einem Lesen oder Schreiben der Bremse (<code>0x8B</code>/<code>0x8C</code>) landet dieser Schreibvorgang im Bremswert. Werte hexadezimal (<code>32</code>, <code>1a 2b</code>); für <code>0x83</code> schreibt man den Namen im Klartext. Ebenfalls absichtlich gesperrt: <code>0x80</code> (Firmware-Update), die Aktivierungsregister <code>0x81</code>/<code>0x82</code> und Bremsmodus 2."
  },

  rgCurve:{it:"curva del grilletto [max, medio 2, medio 1, min, offset fine corsa da 1 a 9]; valori non decrescenti forzano la ricalibrazione all'avvio",en:"trigger curve [max, mid 2, mid 1, min, end-of-travel offset 1 to 9]; non-decreasing values force a recalibration at startup",es:"curva del gatillo [máx, medio 2, medio 1, mín, offset fin de carrera de 1 a 9]; valores no decrecientes fuerzan la recalibración al arrancar",fr:"courbe de la gâchette [max, milieu 2, milieu 1, min, décalage de fin de course de 1 à 9] ; des valeurs non décroissantes forcent le recalibrage au démarrage",de:"Abzugskurve [max, Mitte 2, Mitte 1, min, Offset am Anschlag 1 bis 9]; nicht fallende Werte erzwingen beim Start eine Neukalibrierung"},
  rgRamp:{it:"soglia della rampa, da 0x0F a 0xFA (predefinito 0x7F): ha effetto dalla 4.20b",en:"ramp threshold, 0x0F to 0xFA (default 0x7F): takes effect from 4.20b",es:"umbral de la rampa, de 0x0F a 0xFA (predeterminado 0x7F): tiene efecto desde la 4.20b",fr:"seuil de la rampe, de 0x0F à 0xFA (0x7F par défaut) : prend effet à partir de la 4.20b",de:"Rampenschwelle, 0x0F bis 0xFA (Standard 0x7F): wirkt ab 4.20b"},
  curveHint:{
    it:"<b>Curva (<code>0x93</code>) e rampa (<code>0x94</code>).</b> Il 5° byte della curva è l'offset di fine corsa del grilletto e va tenuto <b>fra 1 e 9</b>: il controller non lo controlla, e con valori grandi il grilletto non frena più al rilascio o non accelera. L'app non manda una curva con l'offset fuori da 1..9. La soglia della rampa esiste dalla 4.18g; nella 4.20a è salvata ma <b>non ha effetto</b>, che arriva con la 4.20b, dal riavvio successivo, limitata da <code>0x0F</code> a <code>0xFA</code> (predefinito <code>0x7F</code>). La 4.20b si presenta ancora come 4.20a: da qui le due versioni non si distinguono. Su un controller che ha avuto una versione fino alla 4.18g può valere <code>0x5A</code> senza che nessuno l'abbia impostata (da verificare). L'app manda solo valori da <code>0x0F</code> a <code>0xFA</code>.",
    en:"<b>Curve (<code>0x93</code>) and ramp (<code>0x94</code>).</b> The 5th byte of the curve is the trigger's end-of-travel offset and must stay <b>between 1 and 9</b>: the controller does not check it, and with large values the trigger no longer brakes when released or does not accelerate. The app does not send a curve whose offset is outside 1..9. The ramp threshold exists since 4.18g; on 4.20a it is saved but <b>has no effect</b>, which comes with 4.20b, from the next restart, limited to <code>0x0F</code>..<code>0xFA</code> (default <code>0x7F</code>). 4.20b still reports itself as 4.20a: from here the two versions cannot be told apart. On a controller that has run a version up to 4.18g it may read <code>0x5A</code> without anyone having set it (to be verified). The app only sends values from <code>0x0F</code> to <code>0xFA</code>.",
    es:"<b>Curva (<code>0x93</code>) y rampa (<code>0x94</code>).</b> El 5.º byte de la curva es el offset de fin de carrera del gatillo y debe quedar <b>entre 1 y 9</b>: el mando no lo comprueba, y con valores grandes el gatillo ya no frena al soltarlo o no acelera. La app no envía una curva con el offset fuera de 1..9. El umbral de la rampa existe desde la 4.18g; en la 4.20a se guarda pero <b>no tiene efecto</b>, que llega con la 4.20b, desde el siguiente reinicio, limitado de <code>0x0F</code> a <code>0xFA</code> (predeterminado <code>0x7F</code>). La 4.20b se presenta todavía como 4.20a: desde aquí las dos versiones no se distinguen. En un mando que ha tenido una versión hasta la 4.18g puede valer <code>0x5A</code> sin que nadie lo haya puesto (por verificar). La app solo envía valores de <code>0x0F</code> a <code>0xFA</code>.",
    fr:"<b>Courbe (<code>0x93</code>) et rampe (<code>0x94</code>).</b> Le 5e octet de la courbe est le décalage de fin de course de la gâchette et doit rester <b>entre 1 et 9</b> : la manette ne le vérifie pas, et avec de grandes valeurs la gâchette ne freine plus au relâchement ou n'accélère pas. L'app n'envoie pas de courbe dont le décalage sort de 1..9. Le seuil de la rampe existe depuis la 4.18g ; en 4.20a il est enregistré mais <b>sans effet</b>, qui arrive avec la 4.20b, au redémarrage suivant, limité de <code>0x0F</code> à <code>0xFA</code> (<code>0x7F</code> par défaut). La 4.20b s'annonce encore comme 4.20a : d'ici, les deux versions ne se distinguent pas. Sur une manette qui a eu une version jusqu'à la 4.18g, il peut valoir <code>0x5A</code> sans que personne ne l'ait réglé (à vérifier). L'app n'envoie que des valeurs de <code>0x0F</code> à <code>0xFA</code>.",
    de:"<b>Kurve (<code>0x93</code>) und Rampe (<code>0x94</code>).</b> Das 5. Byte der Kurve ist der Offset des Abzugs am Anschlag und muss <b>zwischen 1 und 9</b> bleiben: Der Handregler prüft es nicht, und bei großen Werten bremst der Abzug beim Loslassen nicht mehr oder gibt kein Gas. Eine Kurve mit einem Offset außerhalb von 1..9 sendet die App nicht. Die Rampenschwelle gibt es seit 4.18g; in 4.20a wird sie gespeichert, hat aber <b>keine Wirkung</b> — die kommt mit 4.20b, ab dem nächsten Neustart, begrenzt auf <code>0x0F</code> bis <code>0xFA</code> (Standard <code>0x7F</code>). 4.20b meldet sich weiterhin als 4.20a: Von hier aus lassen sich die beiden Versionen nicht unterscheiden. Auf einem Handregler, der eine Version bis 4.18g hatte, kann sie <code>0x5A</code> sein, ohne dass jemand sie gesetzt hat (noch zu prüfen). Die App sendet nur Werte von <code>0x0F</code> bis <code>0xFA</code>."
  },
  e7Hint:{
    it:"Non usare <b>E7:E7</b> come MAC O2: per le auto vuol dire «non abbinata», e un'auto con firmware 4.12b o successivo non resta abbinata a un controller con quel valore (a ogni avvio lo sostituisce con il MAC del proprio chip). L'app lo scrive lo stesso, ma prima lo ricorda.",
    en:"Do not use <b>E7:E7</b> as the O2 MAC: for the cars it means “not paired”, and a car with firmware 4.12b or later does not stay paired with a controller that has that value (at every start it replaces it with its own chip MAC). The app still writes it, but reminds you first.",
    es:"No uses <b>E7:E7</b> como MAC O2: para los coches significa «no vinculado», y un coche con firmware 4.12b o posterior no se queda vinculado a un mando con ese valor (en cada arranque lo sustituye por el MAC de su propio chip). La app lo escribe igualmente, pero antes te lo recuerda.",
    fr:"N'utilise pas <b>E7:E7</b> comme MAC O2 : pour les voitures, cela veut dire « non appairée », et une voiture en firmware 4.12b ou plus récent ne reste pas appairée à une manette qui a cette valeur (à chaque démarrage, elle la remplace par le MAC de sa propre puce). L'app l'écrit quand même, mais te le rappelle d'abord.",
    de:"Verwende <b>E7:E7</b> nicht als O2-MAC: Für die Autos bedeutet das „nicht gekoppelt“, und ein Auto mit Firmware 4.12b oder neuer bleibt nicht mit einem Handregler mit diesem Wert gekoppelt (bei jedem Start ersetzt es ihn durch die MAC seines eigenen Chips). Die App schreibt ihn trotzdem, erinnert dich aber vorher daran."
  },
  warnE7:{
    it:"⚠️ E7:E7 per le auto vuol dire «non abbinata»: un'auto con firmware 4.12b o successivo non resta abbinata a un controller con questo MAC O2.",
    en:"⚠️ For the cars E7:E7 means “not paired”: a car with firmware 4.12b or later does not stay paired with a controller that has this O2 MAC.",
    es:"⚠️ Para los coches E7:E7 significa «no vinculado»: un coche con firmware 4.12b o posterior no se queda vinculado a un mando con este MAC O2.",
    fr:"⚠️ Pour les voitures, E7:E7 veut dire « non appairée » : une voiture en firmware 4.12b ou plus récent ne reste pas appairée à une manette qui a ce MAC O2.",
    de:"⚠️ Für die Autos bedeutet E7:E7 „nicht gekoppelt“: Ein Auto mit Firmware 4.12b oder neuer bleibt nicht mit einem Handregler mit dieser O2-MAC gekoppelt."
  },
  paNote:{
    it:"⚠️ Questo è il <b>modulo Power Amplifier</b> (nome <code>SCP3A-…</code>), il modulo radio opzionale che si monta nell'SCP-3 per la portata lunga, non il controller: risponde a un altro byte dispositivo (<code>0x0B</code>) e ha pochi registri suoi, e questa app non lo gestisce. Per configurare il controller, all'accensione scegli <b>hAndLE</b> (freccia giù) nel menu APP. Senza data di attivazione il modulo non usa la radio.",
    en:"⚠️ This is the <b>Power Amplifier module</b> (name <code>SCP3A-…</code>), the optional radio module fitted in the SCP-3 for long range, not the controller: it answers to a different device byte (<code>0x0B</code>) and has only a few registers of its own, and this app does not handle it. To configure the controller, choose <b>hAndLE</b> (down arrow) in the APP menu at power-on. Without an activation date the module does not use the radio.",
    es:"⚠️ Este es el <b>módulo Power Amplifier</b> (nombre <code>SCP3A-…</code>), el módulo de radio opcional que se monta en el SCP-3 para el alcance largo, no el mando: responde a otro byte de dispositivo (<code>0x0B</code>) y tiene pocos registros propios, y esta app no lo gestiona. Para configurar el mando, al encender elige <b>hAndLE</b> (flecha abajo) en el menú APP. Sin fecha de activación el módulo no usa la radio.",
    fr:"⚠️ C'est le <b>module Power Amplifier</b> (nom <code>SCP3A-…</code>), le module radio optionnel qui se monte dans la SCP-3 pour la longue portée, pas la manette : il répond à un autre octet d'appareil (<code>0x0B</code>) et n'a que quelques registres à lui, et cette app ne le gère pas. Pour configurer la manette, choisis <b>hAndLE</b> (flèche bas) dans le menu APP à l'allumage. Sans date d'activation, le module n'utilise pas la radio.",
    de:"⚠️ Das ist das <b>Power-Amplifier-Modul</b> (Name <code>SCP3A-…</code>), das optionale Funkmodul, das für große Reichweite in den SCP-3 eingesetzt wird, nicht der Handregler: Es antwortet auf ein anderes Gerätebyte (<code>0x0B</code>) und hat nur wenige eigene Register, und diese App unterstützt es nicht. Um den Handregler zu konfigurieren, wähle beim Einschalten im APP-Menü <b>hAndLE</b> (Pfeil runter). Ohne Aktivierungsdatum nutzt das Modul den Funk nicht."
  },

  blkCurveOff:{

    fr:"le 5e octet de la courbe (décalage de fin de course) vaut {v} : il doit aller de 1 à 9. La manette ne le vérifie pas, et avec de grandes valeurs la gâchette ne freine plus au relâchement ou n'accélère pas.",

  blkRamp:{
    it:"la soglia della rampa va da 0x0F a 0xFA (predefinito 0x7F): l'app non manda valori fuori da questo intervallo.",

  blkLen:{

    en:"{reg} wants {n} bytes, you gave {m}: with a frame of a different length the device saves random bytes.",

  blkRange:{it:"valore fuori intervallo ({min}–{max}).",en:"value out of range ({min}–{max}).",es:"valor fuera de rango ({min}–{max}).",fr:"valeur hors plage ({min}–{max}).",de:"Wert außerhalb des Bereichs ({min}–{max})."},
  advLog:{it:"Log",en:"Log",es:"Registro",fr:"Journal",de:"Protokoll"},

  stConnected:{it:"connesso",en:"connected",es:"conectado",fr:"connecté",de:"verbunden"},
  stDisconnected:{it:"non connesso",en:"not connected",es:"no conectado",fr:"non connecté",de:"nicht verbunden"},
  logNoBt1:{

    en:"[!] Web Bluetooth not supported: use Chrome/Edge desktop or Chrome Android.",
    es:"[!] Web Bluetooth no compatible: usa Chrome/Edge escritorio o Chrome Android.",

  },
  logNoBt2:{

    en:"[!] Web Bluetooth not supported. Use Chrome/Edge desktop or Chrome Android. NOT iOS/Safari.",
    es:"[!] Web Bluetooth no compatible. Usa Chrome/Edge escritorio o Chrome Android. NO iOS/Safari.",
    fr:"[!] Web Bluetooth non pris en charge. Utilise Chrome/Edge sur ordinateur ou Chrome sur Android. PAS iOS/Safari.",

  logDisconnected:{it:"[disconnesso]",en:"[disconnected]",es:"[desconectado]",fr:"[déconnecté]",de:"[getrennt]"},
  logConnPrefix:{it:"connesso a",en:"connected to",es:"conectado a",fr:"connecté à",de:"verbunden mit"},

  },
  confirmClone:{

<script src="../i18n.js"></script>
<script>
const APP="remote-config",APP_VERSION="1.7.0";
const NUS="6e400001-b5a3-f393-e0a9-e50e24dcca9e",RX="6e400002-b5a3-f393-e0a9-e50e24dcca9e",TX="6e400003-b5a3-f393-e0a9-e50e24dcca9e";
const PFX=0x0a;                                  // byte del dispositivo in BLE: 0x0a = telecomando (l'auto usa 0x09)
const TYPE_STR="SCP3 Handle", VER_STR="O2 / Analog";   // display fissi della schermata SCP3
/* I registri del TELECOMANDO. Solo questi si leggono e si scrivono, e ciascuno
 * con la sua lunghezza.
 * ⚠️ Non sono gli stessi numeri dell'auto: qui 0x8e/0x94 hanno un altro significato.
 * ⚠️ Fuori da questa lista il telecomando risponde "DO" senza scrivere niente, e
 *    dopo un accesso a 0x8b/0x8c una scrittura su un registro che non gestisce
 *    finisce nel valore del freno: per questo la console non va oltre la tabella.
 *   r  = byte restituiti in lettura      w  = byte da mandare in scrittura
 *   noR / noW = chiave del motivo per cui quel verso è bloccato
 *   min / max (+ rangeK) = intervallo ammesso per i registri a un byte
 *   check = controllo in più sul valore: torna [chiave, parametri] se va rifiutato
 *   hide = non compare in tabella (serve solo a spiegare il blocco) */
const REGS=[
  {reg:0x00,k:"rgVer",r:3,noW:"blkRO"},
  {reg:0x01,k:"rgChipMac",r:6,noW:"blkRO"},
  {reg:0x81,k:"rgActDate",r:5,noW:"blkAct"},
  {reg:0x82,k:"rgActLock",r:4,noW:"blkAct"},
  {reg:0x83,k:"rgName",r:14,w:14},
  {reg:0x88,k:"rgSpdMode",r:1,w:1},
  {reg:0x89,k:"rgSpdMax",r:1,w:1},
  {reg:0x8b,k:"rgBrkVal",r:1,w:1},
  {reg:0x8c,k:"rgBrkMode",r:1,w:1,min:0,max:1,rangeK:"blkSweep"},   // il 2 (Sweep) si perde al riavvio
  {reg:0x8e,k:"rgCode",r:1,w:1},
  {reg:0x8f,k:"rgId",r:1,w:1,min:1,max:20},
  {reg:0x90,k:"rgIdent",r:2,w:2},
  {reg:0x92,k:"rgSpdLim",r:1,w:1},
  /* Il 5° byte della curva è l'offset di fine corsa: il controller non lo
     controlla, e con valori grandi il grilletto non frena più al rilascio o non
     accelera. Fuori da 1..9 non parte. */
  {reg:0x93,k:"rgCurve",r:5,w:5,check:v=>(v[4]<1||v[4]>9)?["blkCurveOff",{v:v[4]}]:null},
  /* Soglia della rampa: conta dalla 4.20b (che si presenta come 4.20a), e il
     controller la limita a 0x0F..0xFA. Si manda solo dentro quell'intervallo. */
  {reg:0x94,k:"rgRamp",r:1,w:1,min:0x0f,max:0xfa,rangeK:"blkRamp"},
  {reg:0x9f,k:"rgRstId",w:1,noR:"blkWO"},          // rimette l'identità di fabbrica: mai dopo una scrittura di 0x90
  {reg:0x80,noR:"blkDfu",noW:"blkDfu",hide:true}   // aggiornamento firmware: non esposto
];
const REG={};for(const d of REGS)REG[d.reg]=d;
let dev,rxc,txc,waiter=null;
const $=id=>document.getElementById(id);
const hx=b=>[...b].map(x=>x.toString(16).padStart(2,"0")).join("");
const asc=b=>[...b].map(x=>x>=32&&x<127?String.fromCharCode(x):".").join("");
const log=s=>{const l=$("log");l.textContent+=s+"\n";l.scrollTop=l.scrollHeight;};
const xorsum=a=>{let x=0;for(const b of a)x^=b;return x&0xff;};
const h2=n=>"0x"+n.toString(16).padStart(2,"0");
const p2=n=>String(n).padStart(2,"0");

/* Perché un registro non si può leggere o scrivere da qui (chiave i18n +
   parametri), oppure null se si può. Lo usano sia la console sia readReg e
   writeReg: un frame vietato non parte da nessuna strada. */
function vietaLettura(reg){const d=REG[reg];if(!d)return["blkUnknownR"];if(d.noR)return[d.noR];if(!d.r)return["blkWO"];return null;}
function vietaScrittura(reg,val){const d=REG[reg];if(!d)return["blkUnknown"];if(d.noW)return[d.noW];if(!d.w)return["blkRO"];
  if(val.length!==d.w)return["blkLen",{reg:h2(reg),n:d.w,m:val.length}];
  if(d.min!=null&&(val[0]<d.min||val[0]>d.max))return[d.rangeK||"blkRange",{min:d.min,max:d.max}];
  if(d.check)return d.check(val);
  return null;}
/* E7:E7 come MAC O2 si può scrivere, ma le auto dalla 4.12b lo prendono per
   «non abbinata» e non restano abbinate: si avvisa, non si vieta. */
const isE7=v=>!!v&&v.length===2&&v[0]===0xe7&&v[1]===0xe7;

/* Il nome (0x83) è di 14 caratteri ASCII esatti, completati con spazi. Prima
   partiva in UTF-8 e senza riempimento: il telecomando copia comunque 14 byte, e
   in coda finivano il checksum e quel che restava nel buffer. Le lettere
   accentate perdono l'accento (à → a), il resto che non è ASCII stampabile si scarta. */
const NAME_LEN=14;
const pulisciNome=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\x20-\x7e]/g,"").slice(0,NAME_LEN);
function byteNome(s){const p=pulisciNome(s);if(!p.trim())return null;return[...p.padEnd(NAME_LEN," ")].map(c=>c.charCodeAt(0));}
/* In rilettura via il riempimento in coda. Il telecomando trasforma in "." gli
   spazi in posizione pari (contando da 0), riempimento compreso: un "." in coda
   in posizione pari era uno spazio, e se ne va con gli altri. */
function leggiNome(v){const b=[...v];
  while(b.length){const i=b.length-1,x=b[i];if(x===0x20||x===0xff||x===0x00||(x===0x2e&&i%2===0))b.pop();else break;}
  return b.map(x=>x>=32&&x<127?String.fromCharCode(x):"?").join("");}

let _conn=false;
function renderStatus(){$("st").textContent=I18N.t(_conn?"stConnected":"stDisconnected");$("st").className="pill"+(_conn?" on":"");}
function setConn(on){_conn=on;renderStatus();
  $("btnConn").disabled=on;$("btnDisc").disabled=!on;
  document.querySelectorAll(".cfg,#btnReadAll").forEach(b=>b.disabled=!on);}
async function connect(){
  if(!navigator.bluetooth){log(I18N.t("logNoBt1"));return;}
  try{
    dev=await navigator.bluetooth.requestDevice({filters:[{services:[NUS]}],optionalServices:[NUS]});
    dev.addEventListener("gattserverdisconnected",()=>{setConn(false);$("devname").textContent="";$("paNote").hidden=true;log(I18N.t("logDisconnected"));});
    /* Il modulo Power Amplifier si presenta come SCP3A-…: è un altro dispositivo
       (byte 0x0B), che questa app non gestisce. Lo si dice subito. */
    $("paNote").hidden=!/^SCP3A/i.test(dev.name||"");
    const g=await dev.gatt.connect(),s=await g.getPrimaryService(NUS);
    rxc=await s.getCharacteristic(RX);txc=await s.getCharacteristic(TX);
    await txc.startNotifications();txc.addEventListener("characteristicvaluechanged",onNotify);
    setConn(true);$("devname").textContent=dev.name||dev.id;log("["+I18N.t("logConnPrefix")+" "+(dev.name||dev.id)+"]");
  }catch(e){log("["+I18N.t("logErrorPrefix")+" "+e+"]");}
}
function onNotify(e){
  const v=new Uint8Array(e.target.value.buffer);
  /* "DO" dice che il frame è stato accettato, non che il registro esista né
     che sia già in memoria (il telecomando risponde prima di salvare). */
  const ann=hx(v)==="444f"?"  "+I18N.t("logDo"):hx(v)==="4142"?"  "+I18N.t("logAb"):"";
  log("  <- "+hx(v)+"  |"+asc(v)+"|"+ann);
  if(waiter)waiter(v);
}
/* Ogni attesa ha il SUO gestore e il SUO timer. Prima il timer di un'attesa già
   risolta, scadendo più tardi, trovava il gestore della richiesta successiva, lo
   azzerava e risolveva la promessa vecchia: quella nuova restava appesa per sempre
   e «Leggi configurazione» si fermava a metà, senza errori. */
const wait=(ms=1200)=>new Promise(r=>{
  const w=v=>{clearTimeout(t);if(waiter===w)waiter=null;r(v);};
  waiter=w;const t=setTimeout(()=>w(null),ms);});
const send=b=>rxc.writeValueWithoutResponse(new Uint8Array(b));
async function readReg(reg){
  const no=vietaLettura(reg);
  if(no){log("READ "+h2(reg)+" — "+I18N.t("logBlocked")+": "+I18N.t(no[0],no[1]));return null;}
  log("READ "+h2(reg));
  // la versione (0x00) risponde solo al frame da 5 byte '0a 12 00 00 02'; gli altri sono '0a 12 <reg>'
  await send(reg===0x00?[PFX,0x12,0x00,0x00,0x02]:[PFX,0x12,reg]);
  return await wait();
}
async function writeReg(reg,val){
  const no=vietaScrittura(reg,val);
  if(no){log("WRITE "+h2(reg)+" — "+I18N.t("logBlocked")+": "+I18N.t(no[0],no[1]));return null;}
  const body=[PFX,0x02,reg,...val];body.push(xorsum(body));
  log("WRITE "+h2(reg)+" = "+hx(val)+(asc(val).match(/^[ -~]+$/)?" |"+asc(val)+"|":""));await send(body);return await wait();}

/* decodifiche leggibili */
function fwStr(v){return v&&v.length>=3?v[0]+"."+v[1]+(v[2]>=32&&v[2]<127?String.fromCharCode(v[2]).toUpperCase():""):"—";}
function dateStr(v){return v&&v.length>=5?p2(v[0])+"/"+p2(v[1])+"/"+(2000+v[2])+" "+p2(v[3])+":"+p2(v[4]):"—";}
function fmt(reg,v){if(!v)return I18N.t("noResp");if(reg===0x00)return hx(v)+" → "+fwStr(v);return hx(v)+" |"+asc(v)+"|";}

/* leggi tutta la config e popola i campi (solo i registri leggibili della tabella) */
async function readAll(){
  for(const d of REGS){if(!d.r||d.noR)continue;const r=d.reg;
    const v=await readReg(r);const c=$("v"+r);if(c)c.textContent=fmt(r,v);
    if(v){
      if(r===0x00)$("fFw").textContent=fwStr(v);
      if(r===0x81)$("fDate").textContent=dateStr(v);
      if(r===0x83)$("cName").value=leggiNome(v);
      if(r===0x8c){
        /* Solo 0 e 1 sono offerti: un altro valore lascia il menu vuoto e lo dice. */
        if(v[0]===0||v[0]===1)$("cBrake").value=String(v[0]);
        else{$("cBrake").value="";log(I18N.t("logBrakeOdd",{v:v[0]}));}
      }
      if(r===0x8f){$("cId").value=v[0];$("fId").textContent=v[0];}
      if(r===0x90){$("cMac").value=hx(v);$("cMac").dispatchEvent(new Event("input"));$("fMac").textContent=[...v].map(x=>x.toString(16).padStart(2,"0")).join(" ").toUpperCase();
        if(isE7(v))log(I18N.t("warnE7"));}
      if(r===0x93&&v.length>=5&&(v[4]<1||v[4]>9))log(I18N.t("logCurveOff",{v:v[4]}));
    }
    await new Promise(x=>setTimeout(x,110));
  }
  $("fType").textContent=TYPE_STR;$("fVer").textContent=VER_STR;   // display fissi della schermata SCP3
}
/* Byte in esadecimale: "32", "0x32", "1a 2b", "1a:2b". Una cifra sola vale un byte ("5" → 05). */
function parseHex(s){s=(s||"").trim().replace(/0x/gi,"").replace(/[\s:,.-]/g,"");
  if(!s||!/^[0-9a-f]+$/i.test(s))return null;if(s.length%2)s="0"+s;
  return[...s.matchAll(/../g)].map(m=>parseInt(m[0],16));}
function parseReg(s){const m=(s||"").trim().replace(/^0x/i,"");return/^[0-9a-f]{1,2}$/i.test(m)?parseInt(m,16):null;}

/* Messaggio della console: si ricorda chiave e parametri per ridisegnarsi al cambio lingua. */
let rawMsg=null;
function setRawMsg(m){rawMsg=m;renderRawMsg();}
function renderRawMsg(){$("rawMsg").textContent=rawMsg?(rawMsg.reg!=null?h2(rawMsg.reg)+": ":"")+I18N.t(rawMsg.k,rawMsg.p):"";}
const fns={
  /* "Scrivi": Nome (0x83) + modo freno (0x8c), come il tasto Scrivi dell'app */
  write:async()=>{
    const nb=byteNome($("cName").value);
    if(nb)await writeReg(0x83,nb);else log(I18N.t("logNameSkip"));
    const b=$("cBrake").value;
    if(b==="")log(I18N.t("logBrakeUnset"));
    else await writeReg(0x8c,[parseInt(b)]);
  },
  id:()=>writeReg(0x8f,[Math.max(1,Math.min(20,parseInt($("cId").value)||1))]),
  /* Scrive SOLO 0x90. 0x9f rimette l'identità di fabbrica (ricavata dal MAC del
   * chip): mandato dopo, annullerebbe la scrittura. È il pulsante a parte. */
  clone:()=>{const b=parseHex($("cMac").value);if(!b||b.length!==2)return alert(I18N.t("alertMac"));
    const q=I18N.t("confirmClone",{mac:hx(b).toUpperCase()})+(isE7(b)?"\n\n"+I18N.t("warnE7"):"");
    if(confirm(q))return writeReg(0x90,b);},
  rstmac:()=>{if(confirm(I18N.t("confirmRstMac")))return writeReg(0x9f,[0x00]);},
  rawread:async()=>{const r=parseReg($("rReg").value);
    if(r==null)return setRawMsg({k:"blkBadReg"});
    const no=vietaLettura(r);if(no)return setRawMsg({reg:r,k:no[0],p:no[1]});
    setRawMsg(null);const v=await readReg(r);const c=$("v"+r);if(c)c.textContent=fmt(r,v);},
  rawwrite:async()=>{const r=parseReg($("wReg").value);
    if(r==null)return setRawMsg({k:"blkBadReg"});
    const s=$("wVal").value;
    const val=r===0x83?(byteNome(s)||[]):parseHex(s);   // il nome si scrive in chiaro
    if(!val)return setRawMsg({reg:r,k:"blkBadVal"});
    const no=vietaScrittura(r,val);if(no)return setRawMsg({reg:r,k:no[0],p:no[1]});
    /* E7:E7 nel MAC O2 parte lo stesso, ma la console lo ricorda */
    setRawMsg(r===0x90&&isE7(val)?{reg:r,k:"warnE7"}:null);await writeReg(r,val);},
};
document.querySelectorAll("[data-fn]").forEach(b=>b.onclick=()=>fns[b.dataset.fn]&&fns[b.dataset.fn]());
/* Tabella dei registri. Il pulsante "leggi" c'è solo dove leggere è lecito. */
(function(){const tb=$("regtab").querySelector("tbody");for(const d of REGS){if(d.hide)continue;const r=d.reg;
  const tr=document.createElement("tr");
  tr.innerHTML=`<td><code>${h2(r)}</code></td><td data-i18n="${d.k}"></td><td class="val" id="v${r}"></td><td></td>`;tb.appendChild(tr);
  if(!d.r||d.noR)continue;
  const bt=document.createElement("button");bt.className="sec cfg";bt.disabled=true;bt.setAttribute("data-i18n","regReadBtn");
  bt.onclick=async()=>{const v=await readReg(r);$("v"+r).textContent=fmt(r,v);};tr.lastElementChild.appendChild(bt);}})();

/* Nome: si ripulisce mentre lo scrivi, così vedi subito cosa partirà. */
(function(){const c=$("cName");c.addEventListener("input",()=>{const v=c.value,p=pulisciNome(v);if(p===v)return;
  const pos=Math.max(0,(c.selectionStart||0)-(v.length-p.length));c.value=p;try{c.setSelectionRange(pos,pos);}catch(e){}});})();

$("btnConn").onclick=connect;
$("btnDisc").onclick=()=>{if(dev&&dev.gatt.connected)dev.gatt.disconnect();};
$("btnReadAll").onclick=readAll;
// banner compatibilità Web Bluetooth
if(!navigator.bluetooth){$("nobt").hidden=false;$("btnConn").disabled=true;}
// service worker network-first: sempre l'ultima versione (fix cache)
if("serviceWorker" in navigator)navigator.serviceWorker.register("../sw.js").catch(()=>{});

/* stringhe dinamiche iniziali + ri-render al cambio lingua */
function initDynamic(){renderStatus();if(!navigator.bluetooth)log(I18N.t("logNoBt2"));}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",initDynamic);
else initDynamic();
document.addEventListener("i18n:changed",()=>{renderStatus();renderRawMsg();});

/* versione: nel piè, e la fascia «Aggiorna» se quella pubblicata è un'altra */
document.getElementById("appver").textContent=APP_VERSION;
function reloadFresh(){location.href=location.pathname+"?v="+Date.now();}
fetch("../version.json?_="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(j=>{
  if(j.apps&&j.apps[APP]&&j.apps[APP]!==APP_VERSION)document.getElementById("upd").hidden=false;}).catch(()=>{});

/* Il MAC O2 è 2 byte = ESATTAMENTE 4 cifre esadecimali. Il campo non si lascia
   riempire di altro: filtra i caratteri non validi e si ferma a quattro, così
   il valore sbagliato non si può nemmeno digitare. Se resta incompleto il bordo
   diventa rosso, e la funzione di scrittura rifiuta comunque (alertMac).
   ⚠️ Il pulsante NON viene toccato qui: la sua abilitazione dipende dalla
   connessione (vedi setConn), e metterci le mani lo riaccenderebbe da scollegato. */
(function(){
  const c=document.getElementById("cMac"); if(!c)return;
  const valido=()=>/^[0-9A-F]{4}$/.test(c.value);
  function check(){
    c.value=c.value.replace(/[^0-9a-fA-F]/g,"").slice(0,4).toUpperCase();
    c.style.borderColor=(c.value.length&&!valido())?"var(--err)":"";
  }
  c.addEventListener("input",check); c.addEventListener("blur",check); check();
})();
</script>
