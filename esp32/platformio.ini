; PlatformIO project for the DS200/DS300 -> MQTT + Web bridge on ESP32.
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor -b 115200
;
; Wiring (RS-232 needs a MAX3232 level shifter — NEVER wire RS-232 ±12V
; straight to the ESP32, it will destroy the 3.3V pins):
;
;   DS200 DB9 TX ──> MAX3232 (RS232 R1IN) ──> MAX3232 (TTL R1OUT) ──> ESP32 GPIO16 (UART2 RX)
;   DS200 DB9 GND ─────────────────────────────────────────────────> ESP32 GND
;   MAX3232 VCC ─> ESP32 3V3,  MAX3232 GND -> ESP32 GND
;   (the DS200 only transmits, so ESP32 TX/GPIO17 is left unused)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; BLE (NimBLE) + WiFi + web server need more app space than the default layout.
board_build.partitions = huge_app.csv

; Loads esp32/.env (git-ignored) and injects it as -D build flags. Secrets live
; in .env, not in config.h. See .env.example.
extra_scripts =
    pre:scripts/load_env.py
    ; Copia web/cronometro (+ ui.css, tema.js, il decoder) in esp32/data/, da cui
    ; si costruisce l'immagine LittleFS. Prima l'app era incollata a mano dentro
    ; src/web_index.h e stava invecchiando in silenzio: ora la sorgente e' una
    ; sola e questo e' un passo di build. Dopo `pio run -t upload` serve anche
    ; `pio run -t uploadfs`, altrimenti il firmware c'e' ma le pagine no.
    pre:scripts/copy_webapp.py

lib_deps =
    https://github.com/tzapu/WiFiManager.git
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4
    esphome/ESPAsyncWebServer-esphome @ ^3.1.0
    esphome/AsyncTCP-esphome @ ^2.0.1
    jnthas/Improv WiFi Library @ ^0.0.2
    h2zero/NimBLE-Arduino @ ^1.4.2

build_flags =
    -DCORE_DEBUG_LEVEL=2
